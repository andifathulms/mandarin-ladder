# Sentence recordings (PRD §5.6). Commissioned recordings of the Easy 1 examples and dialogues are
# planned; until they are ingested (npm run audio:list → record → npm run audio:ingest), Chinese text
# plays with the browser's zh-CN voice, and play buttons hide where there is none.
