    - （2）用关联词语：一边⋯⋯，一边⋯⋯；⋯⋯，也⋯⋯
    - 他一边走路，一边唱歌。
    - 哥哥一边看电视，一边吃东西。
    - 我喜欢唱歌，弟弟也喜欢唱歌。
    - 这个房间很大，也很干净。
