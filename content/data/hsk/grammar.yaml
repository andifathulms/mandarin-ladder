    - 你等一下儿，他在打电话呢。
    - 老师进来的时候，我正听歌呢。
    - 同学们正在考试呢。
    - （3）⋯⋯呢
    - 我没看电视，看书呢。
    - 甲：你在做什么？
    - 乙：我洗衣服呢。
