  hsk: '2'
  code: 二16
  title: 频率、重复副词：重新、经常、老、老是、又
  examples:
    - 这篇作文我要重新写一遍。
    - 我经常看见他在图书馆学习。
    - 这个汉字有点儿难，我老写错。
    - 这个月北京老是下雨。
    - 我们队又进了一个球。
- id: g2-17
  hsk: '2'
  code: 二17
  title: 关联副词：就
  examples:
    - 如果明天天气好，我就去爬山。
    - 你有时间的话，我们就一起出去走走吧。
- id: g2-18
  hsk: '2'
  code: 二18
  title: 方式副词：故意
  examples:
    - 说话的时候，他故意提高声音，这样大家都能听见。
    - 我不是故意弄坏电脑的。
- id: g2-19
  hsk: '2'
  code: 二19
  title: 情态副词：必须、差不多、好像、一定、也许
  examples:
    - 要取得好成绩，大家必须努力学习。
    - 机票差不多要两千块钱。
    - 今天好像要下雨。
    - 你到北京后，一定要去看看王老师。
    - 我今年也许会去中国学习中文。
- id: g2-20
  hsk: '2'
  code: 二20
  title: 语气副词：才、都、就、正好
  examples:
    - 我今天八点才起床。
    - 她一百块钱才买了两本书。
    - 都十二点了，我们该睡觉了。
    - 班长七点半就到教室了。
    - 他一遍就听懂了这个很长的句子。
    - 今年我的生日正好是星期天。
- id: g2-21
  hsk: '2'
  code: 二21
  title: 当
  examples:
    - 当他进来的时候，我们正在看电视。
    - 当爸爸回来的时候，妈妈已经做好晚饭了
- id: g2-22
  hsk: '2'
  code: 二22
  title: 往
  examples:
    - 你往左走，就能看见洗手间。
    - 你往前走一百米就到了。
- id: g2-23
  hsk: '2'
  code: 二23
  title: 向
  examples:
    - 你向西边看，看见西山了吗？
    - 他向图书馆走去了。
- id: g2-24
  hsk: '2'
  code: 二24
  title: 从
  examples:
    - 你从这儿走，五分钟就到书店了。
    - 这路公交车从我们学校门口过。
- id: g2-25
  hsk: '2'
  code: 二25
  title: 对
  examples:
    - 她对顾客非常热情。
    - 这件事你对他说了吗？
- id: g2-26
  hsk: '2'
  code: 二26
  title: 给
  examples:
    - 我晚上要给女朋友打电话。
    - 她后天过生日，我们给她送什么礼物呢？
- id: g2-27
  hsk: '2'
  code: 二27
  title: 离
  examples:
    - 这儿离车站有点儿远。
    - 现在离放假有一个星期的时间。
- id: g2-28
  hsk: '2'
  code: 二28
  title: 为
  examples:
    - 为大家的健康干杯！
    - 我们都为你的好成绩高兴。
- id: g2-29
  hsk: '2'
  code: 二29
  title: 连接词或短语：或、或者
  examples:
    - 星期天我想去看电影或听音乐会。
    - 我下午去打球或者去爬山。
- id: g2-30
  hsk: '2'
  code: 二30
  title: 连接分句或句子：不过、但、但是、而且、那、如果、虽然、只要
  examples:
    - 现在已经是冬天了，但北京还不太冷。
    - 你不去，那我就一个人去。
    - （“不过、但是、而且、如果、虽然、只要”例句参见复句部分）
- id: g2-31
  hsk: '2'
  code: 二31
  title: 结构助词：得
  examples:
    - 他走得有点儿快。
    - 她篮球打得很不错。
- id: g2-32
  hsk: '2'
  code: 二32
  title: 动态助词：过
  examples:
    - 我去过一次中国。/我没去过中国。
    - 他学过一点儿中文，他没学过中文。
- id: g2-33
  hsk: '2'
  code: 二33
  title: 动态助词：着
  examples:
    - 门关着。/门没关着。
    - 电视开着呢。/电视没开着。
    - 他穿着一件黑大衣。
    - 孩子们在教室里高兴地唱着歌。
- id: g2-34
  hsk: '2'
  code: 二34
  title: 语气助词：啊、吧、的
  examples:
    - 今天真冷啊！
    - 您是老师吧？
    - 我是昨天来的。
- id: g2-35
  hsk: '2'
  code: 二35
  title: 其他助词：的话、等
  examples:
    - 你要来的话，就给我打个电话，我去接你。
    - 我去超市买了很多东西，有酒、水果、牛奶等。
- id: g2-36
  hsk: '2'
  code: 二36
  title: 喂
  examples:
    - 喂，是王老师吗？
    - 喂，您找哪位？
- id: g2-37
  hsk: '2'
  code: 二37
  title: 基本结构类型
  examples:
    - （1）联合短语
    - 北京上海 我和他 又大又干净 去不去
    - （2）偏正短语
    - 新衣服 学校的图书馆 认真学习 特别开心
    - （3）动宾短语
    - 买东西 吃水果 学习中文 进教室
    - （4）动补短语
    - 听清楚 走来 说得很高兴 听两遍
    - （5）主谓短语
    - 我休息 他出国 教室很大 学习认真
- id: g2-38
  hsk: '2'
  code: 二38
  title: 其他结构类型1
  examples:
    - （1）“的”字短语
    - 我的 黑色的 新的 吃的 他买的
    - （2）连谓短语
    - 去买东西 哭着说 坐飞机去北京 去图书馆借书
- id: g2-39
  hsk: '2'
  code: 二39
  title: 名词性短语
  examples:
    - 新书 我的衣服 中文水平 一条河 两本 这件
- id: g2-40
  hsk: '2'
  code: 二40
  title: 动词性短语
  examples:
    - 买水果 写完 拿出来 常常休息 可以去
- id: g2-41
  hsk: '2'
  code: 二41
  title: 形容词性短语
  examples:
    - 很舒服 非常高兴 大一点儿 又漂亮又可爱
- id: g2-42
  hsk: '2'
  code: 二42
  title: 不一会儿
  examples:
    - 今天的作业我不一会儿就做完了。
    - 我们走到车站，不一会儿，公交车就来了。
- id: g2-43
  hsk: '2'
  code: 二43
  title: 什么的
  examples:
    - 考试前多做点儿练习什么的。
    - 我去超市买了一些水果、面包什么的。
- id: g2-44
  hsk: '2'
  code: 二44
  title: 越来越
  examples:
    - 天气越来越热了。
    - 我越来越喜欢学习中文。
- id: g2-45
  hsk: '2'
  code: 二45
  title: 还是⋯⋯吧
  examples:
    - 打车太贵了，你还是坐地铁吧。
    - 外边下雨了，我们还是在房间看电视吧。
- id: g2-46
  hsk: '2'
  code: 二46
  title: 又⋯⋯又⋯⋯
  examples:
    - 这个饭馆的菜又好吃又便宜。
    - 这球鞋又贵又不好看。
- id: g2-47
  hsk: '2'
  code: 二47
  title: （在）⋯⋯以前/以后/前/后
  examples:
    - 在来中国以前，我只学过一点儿中文。
    - 吃完午饭以后，我常常会睡一会儿。
    - 你运动前应该活动一下儿身体。
    - 我明天下课后就去你那儿。
- id: g2-48
  hsk: '2'
  code: 二48
  title: 名词、代词、数词或数量短语、名词性短语作谓语
  examples:
    - 今天晴天。
    - 明天星期五。
    - 这儿怎么样？
    - 他四十，女儿十六。
    - 这本中文书二十五块。
    - 我北京人 今年二十五岁。
    - 她高个子，黄头发，很漂亮。
- id: g2-49
  hsk: '2'
  code: 二49
  title: 结果补语1：动词+错/懂/干净/好/会/清楚/完
  examples:
    - 写错 看懂 洗干净 做好 学会 听清楚 吃完
    - 你写错了两个汉字。
    - 这个句子我没看懂。
    - 衣服我洗干净了。
    - 这道题你学会了没有？
    - 这道题我没学会。
    - 你听清楚老师的话了吗？
    - 老师的话我听清楚了。
- id: g2-50
  hsk: '2'
  code: 二50
  title: 趋向补语1
  examples:
    - 简单趋向补语的趋向意义用法
    - （1）动词+ 来 / 去
    - 你看，他向这边走来了。
    - 甲：这件礼物怎么给他？
    - 乙：你给他带去吧。
    - 我明天带一个相机来。
    - 他昨天带了一个相机。
    - 甲：你的词典呢？
    - 乙：不好意思，我没拿来。
    - （2）动词+ 上 / 下 / 进 / 起 / 过 / 回 / 开
    - 你爬上十九楼了没有？
    - 我没爬上十九楼，到十楼就不行了。
- id: g2-51
  hsk: '2'
  code: 二51
  title: 状态补语1：动词+得+形容词性词语
  examples:
    - 她跑得很快。
    - 我们玩儿得很高兴。
- id: g2-52
  hsk: '2'
  code: 二52
  title: 数量补语1：动词+动量补语
  examples:
    - 我去过一次。
    - 我们休息一下儿。
- id: g2-53
  hsk: '2'
  code: 二53
  title: 数量补语2：形容词+数量补语
  examples:
    - 我比弟弟大两岁。
    - 昨天很热，今天凉快一点儿。
    - 她的中文比我流利一些。
- id: g2-54
  hsk: '2'
  code: 二54
  title: 主谓句3：名词谓语句
  examples:
    - 明天阴天。
    - 他中国人。
    - 现在八点二十分。
- id: g2-55
  hsk: '2'
  code: 二55
  title: “有”字句2
  examples:
    - （1）表示评价、达到
    - 他有一米八高。
    - 他有三十多岁。
    - （2）表示比较（见【二58】“比较句2-（4）”）
- id: g2-56
  hsk: '2'
  code: 二56
  title: 存现句1：表示存在
  examples:
    - （1）处所+有+数量短语+名词（见【一37】“‘有’字句1-（2）”）
    - （2）处所+动词+着（+数量短语）+名词
    - 桌子上放着一本词典。
    - 教室前边站着一位老师。
    - 桌子上放着书、笔和本子。
- id: g2-57
  hsk: '2'
  code: 二57
  title: 连动句1：表示前后动作先后发生
  examples:
    - 他开门出去了。
    - 我们吃完饭去图书馆吧。
- id: g2-58
  hsk: '2'
  code: 二58
  title: 比较句2
  examples:
    - （1）A比B+形容词+数量补语
    - 姐姐比我大两岁。
    - 房间外边比里边凉快一些。
    - （2）A比B+更/还+形容词
    - 他的手机比我的更贵。
    - 今天比昨天还凉快。
    - （3）A不如B（+形容词）
    - 我的中文成绩不如班长。
    - 火车不如飞机快。
    - （4）A有B（+这么/那么）+形容词
    - 你哥哥有你高吗？
    - 她家的院子有篮球场那么大。
- id: g2-59
  hsk: '2'
  code: 二59
  title: 比较句3
  examples:
    - （1）A跟B一样/相同
    - 我的爱好跟姐姐一样。
    - 他的想法跟我相同。
    - 哥哥的手机跟我的不一样。
    - 我跟她一样，都是这个学校的学生。
    - （2）A跟B-样+形容词
    - 姐姐跟妹妹一样可爱。
    - 哥哥和弟弟不一样高。
- id: g2-60
  hsk: '2'
  code: 二60
  title: “是⋯⋯的”句1：强调时间、地点、方式、动作者
  examples:
    - 我是昨天到北京的。
    - 他是在网上买的手机。
    - 我们是坐飞机来的。
    - 这件事是老师告诉我的。
- id: g2-61
  hsk: '2'
  code: 二61
  title: 双宾语句
  examples:
    - （1）主语+动词+宾语1+宾语？
    - 我给妹妹一本书。
    - 爸爸送我一辆汽车。
    - （2）主语+动词+给+宾语1+宾语2
    - 朋友借给我一千块钱。
    - 姐姐送给我一个手机。
- id: g2-62
  hsk: '2'
  code: 二62
  title: 承接复句
  examples:
    - （1）不用关联词语
    - 吃了晚饭，我们出去走走。
    - 他回房间拿了衣服，去教室上课了。
    - （2）用关联词语：先⋯⋯，再/然后⋯⋯
    - 你先去超市买东西，再回家。
    - 我先去吃午饭，然后回房间休息。
- id: g2-63
  hsk: '2'
  code: 二63
  title: 递进复句
  examples:
    - （1）不用关联词语
    - 那个地方我去过了，去过两次了。
    - 他弟弟会说中文，说得很流利。
    - （2）用关联词语：⋯⋯，更/还⋯⋯；不但⋯⋯，而且⋯⋯
    - 昨天很冷，今天更冷了。
    - 班长学习很好，还经常帮助同学。
    - 她不但会说中文，而且说得很好。
- id: g2-64
  hsk: '2'
  code: 二64
  title: 选择复句
  examples:
    - （1）不用关联词语
    - 这次旅行你坐火车，坐飞机？
    - 我们星期六去，星期天去？
    - （2）用关联词语：（是）⋯⋯，还是⋯⋯
    - 你是坐火车来的，还是坐飞机来的？
    - 周末你们想去打排球，还是想去打篮球？
- id: g2-65
  hsk: '2'
  code: 二65
  title: 转折复句
  examples:
    - （1）不用关联词语
    - 这件衣服样子不错，有点儿贵。
    - 这次去饭店，我们花钱不多，吃得很不错。
    - （2）用关联词语：虽然⋯⋯，但是/可是⋯⋯；⋯⋯；不过⋯⋯
    - 那个公园虽然不大，但是非常漂亮。
    - 虽然明天可能下雨，可是我还是想去那儿看看。
    - 这个房间不太大，不过住着很舒服。
- id: g2-66
  hsk: '2'
  code: 二66
  title: 假设复句
  examples:
    - （1）不用关联词语
    - 明天下雨，我们在家休息。
    - 明天不下雨，我们出去玩儿。
    - （2）用关联词语：如果⋯⋯，就⋯⋯; ⋯⋯的话， 就⋯⋯
    - 如果你下午有时间，我们就一起去超市吧。
    - 明天天气不好的话，我就不去公园了。
- id: g2-67
  hsk: '2'
  code: 二67
  title: 条件复句：只要⋯⋯，就⋯⋯
  examples:
    - 只要你认真学习，就一定能取得好成绩。
    - 只要你通过这次考试，我就送你一件礼物。
- id: g2-68
  hsk: '2'
  code: 二68
  title: 因果复句
  examples:
    - （1）不用关联词语
    - 我今天太忙了，午饭都没吃。
    - 那个学生病了，没来上课。
    - （2）用关联词语：因为⋯⋯，所以⋯⋯
    - 因为很累，所以我今天不想做饭了。
    - 因为明天有考试，所以我想早一点儿睡觉。
- id: g2-69
  hsk: '2'
  code: 二69
  title: 紧缩复句：一⋯⋯就⋯⋯
  examples:
    - 他一起床就去洗脸。
    - 我一喝酒就脸红。
- id: g2-70
  hsk: '2'
  code: 二70
  title: 持续态：动词+着
  examples:
    - （1）表示状态的持续
    - 灯一直亮着。/灯没亮着。
    - 电脑开着。/电脑没开着。
    - （2）表示动作的持续
    - 外边下着雪呢。/外边没下雪。
    - 他们说着、笑着，不一会儿就到学校了。
- id: g2-71
  hsk: '2'
  code: 二71
  title: 经历态：用动态助词“过”表示
  examples:
    - 他学过中文。/他没学过中文。
    - 我吃过饺子。/我没吃过饺子。
- id: g2-72
  hsk: '2'
  code: 二72
  title: 序数表示法
  examples:
    - 第一 第三 第七 二楼 三层
    - 13号楼 205房间 302路公交车
- id: g2-73
  hsk: '2'
  code: 二73
  title: 概数表示法1
  examples:
    - （1）数词+多+量词
    - 三十多本 五十多斤
    - （2）数词+量词+多
    - 三块多 四米多 七斤多
- id: g2-74
  hsk: '2'
  code: 二74
  title: 用“就”表示强调
  examples:
    - 教学楼就在前边。
    - 你看，这就是我们上课的教室。
    - ※“是⋯⋯的”表示强调（见【二60】“是⋯⋯的”句 1和【四42】“是⋯⋯的”句2）
- id: g2-75
  hsk: '2'
  code: 二75
  title: 用“好吗、可以吗、行吗、怎么样”提问
  examples:
    - 我们明天八点出发，好吗？
    - 你明天早点儿来，可以吗？
    - 你的词典借我用用，行吗？
    - 我们今天吃面条儿，怎么样？
- id: g2-76
  hsk: '2'
  code: 二76
  title: 用 "什么时候、什么样、为什么、怎么样、怎样”提问
  examples:
    - 你们什么时候见面？
    - 你喜欢什么样的朋友？
    - 你为什么没去上课？
    - 明天天气怎么样？
    - 你明天怎样去学校？
- id: g2-77
  hsk: '2'
  code: 二77
  title: 用“呢”构成的省略式疑问句“代词/名词+呢？”提问
  examples:
    - 我去医院，你呢？
    - 书在桌子上，笔呢？
- id: g2-78
  hsk: '2'
  code: 二78
  title: 用“是不是”提问
  examples:
    - 你要去体育馆打球，是不是？
    - 是不是你拿了我的笔？
    - 你是不是有很多中国朋友？
- id: g2-79
  hsk: '2'
  code: 二79
  title: 用“吧”提问
  examples:
    - 您是经理吧？
    - 你以前学过中文吧？
- id: g2-80
  hsk: '2'
  code: 二80
  title: 该⋯⋯了
  examples:
    - 十一点了，该睡觉了。
    - 明天有听写，我该复习生词了。
- id: g2-81
  hsk: '2'
  code: 二81
  title: 要/快要/就要⋯⋯了
  examples:
    - 要下雨了。
    - 我们快要放假了。
    - 他们明天就要考试了。
- id: g3-01
  hsk: '3'
  code: 三01
  title: 第-、老-、小-
  examples:
    - 第一 第三 老二 老王 小李 小王
- id: g3-02
  hsk: '3'
  code: 三02
  title: '-儿、一家、-们、-头、-子'
  examples:
    - 画儿 空儿 画家 作家 朋友们 老师们 石头 里头 瓶子 屋子
- id: g3-03
  hsk: '3'
  code: 三03
  title: 能愿动词：敢
  examples:
    - 这儿有两米高，你敢跳下去吗？
    - 我不敢在河里游泳。
- id: g3-04
  hsk: '3'
  code: 三04
  title: 能愿动词：需要
  examples:
    - 她生病了，需要休息。
    - 我们不需要买吃的，家里有很多。
- id: g3-05
  hsk: '3'
  code: 三05
  title: 动宾式离合词：帮忙、点头、放假、干杯、见面、结婚、看病、睡觉、洗澡、理发、说话
  examples:
    - 他经常帮我的忙。
    - 他点了一下儿头，表示同意。
    - 我想放了假就去旅行。
    - 来，我们一起干一杯。
    - 来中国以后，我们只见过一次面。
    - 结了婚以后，她就不工作了。
    - 病人看完病就去取药了。
- id: g3-06
  hsk: '3'
  code: 三06
  title: 动补式离合词：打开、看见，离开、完成
  examples:
    - 你的文件我打不开，你能再给我发一下儿吗？
    - 黑板上的字很小，我们都看不见。
    - 放心吧，孩子这么大，离得开妈妈了。
    - 我们完不成这个任务。
- id: g3-07
  hsk: '3'
  code: 三07
  title: 疑问代词的非疑问用法
  examples:
    - （1）任指用法
    - ①疑问代词+都
    - 谁都喜欢她。
    - 我吃什么都行。
    - 你什么时候来都可以。
    - 我哪儿都没去过。
    - 你想怎么去都没问题。
    - ②疑问代词+疑问代词
    - 你们随便吃，想吃什么吃什么。
    - 谁想参加比赛谁就报名参加。
    - 他们几点来就几点开始。
    - 你怎么做，我就怎么做。
- id: g3-08
  hsk: '3'
  code: 三08
  title: 指示代词：各、各位、各种、每、任何
  examples:
    - 我们班的同学来自世界各国。
    - 各位朋友，下午好！
    - 这儿有各种颜色的花。
    - 我每个星期天都去爬山。
    - 我们任何时候都要注意保护环境。
- id: g3-09
  hsk: '3'
  code: 三09
  title: 名量词：把、行、架、群、束、双、台、张、支、只、种
  examples:
    - 一把椅子 两行汉字 一架飞机 一群学生 两束花 一双球鞋
    - 两台电脑 一张桌子 一支笔 三只鸡 两种颜色
- id: g3-10
  hsk: '3'
  code: 三10
  title: 动量词：顿、口、眼
  examples:
    - 批评一顿 喝一口 看一眼
- id: g3-11
  hsk: '3'
  code: 三11
  title: 量词重叠：AA
  examples:
    - 家家 件件 条条 次次 回回 顿顿 天天 年年
- id: g3-12
  hsk: '3'
  code: 三12
  title: 程度副词：比较、更加，还、相当
  examples:
    - 我比较喜欢游泳。
    - 她以前学习就很努力，现在更加努力了。
    - 这个房间不干净，那个房间还干净一些。
    - 这个公园的景色相当漂亮。
- id: g3-13
  hsk: '3'
  code: 三13
  title: 范围、协同副词：光、仅、仅仅、就、至少
  examples:
    - 他每天光玩儿不学习。
    - 今天来上课的仅有五个学生。
    - 这次旅行仅仅花了三千块。
    - 我们班就他知道这个消息。
    - 我就拿了一支笔。
    - 教室里至少有五十个人。
- id: g3-14
  hsk: '3'
  code: 三14
  title: 时间副词：本来、才、曾经、从来、赶紧、赶快、立刻、连忙、始终、已、早已
  examples:
    - 会议本来在星期一举行，但是现在改时间了。
    - 他才起床，让我们等一下儿。
    - 你怎么才来就要走？
    - 我曾经学过一年中文。
    - 他从来不喝酒。
    - 听到这个消息，他赶紧跑回家去了。
    - 听到有人叫他的名字，他赶紧开门。
    - 他很不舒服，我们要赶快送他去医院。
    - 经理来电话，叫我立刻去她的办公室。
    - 看到一位老人上车，我连忙站起来让他坐。
    - 她在中国留学的时候，始终坚持每天说中文。
    - 我们已做好下个月的工作计划。
- id: g3-15
  hsk: '3'
  code: 三15
  title: 频率、重复副词：通常、往往、总、总是
  examples:
    - 李经理通常很早就到公司。
    - 为了记住一个汉字，他往往要写很多遍。
    - 我总弄不明白什么时候用“把”字句，常常一说就错。
    - 他去机场总是提前两个小时出发。
- id: g3-16
  hsk: '3'
  code: 三16
  title: 关联副词：再
  examples:
    - 我们做完作业再玩儿游戏。
    - 你洗了手再吃水果。
- id: g3-17
  hsk: '3'
  code: 三17
  title: 方式副词：互相、尽量、亲自、相互
  examples:
    - 大家要互相帮助。
    - 志愿者要尽量自己克服困难。
    - 校长亲自联系学生实习的公司。
    - 我们要相互关心，相互照顾。
- id: g3-18
  hsk: '3'
  code: 三18
  title: 情态副词：大概、恐怕
  examples:
    - 他病了，今天大概不会来上课了
    - 天这么阴，大概要下雨。
    - 我头有点儿疼，恐怕是感冒了。
    - 他出国恐怕已经有三年多了吧。
- id: g3-19
  hsk: '3'
  code: 三19
  title: 语气副词：白、并、当然、到底、反正、根本、果然、简直、绝对、难道、其实、千万、确实、只好、终于
  examples:
    - 老师不在办公室，我白去了。
    - 这次考试并没有他们说的那么简单。
    - 学生当然应该做作业。
    - 他到底是老师还是学生？
    - 我不知道是谁做的，反正不是我做的。
    - 她根本不相信我。
    - 天气预报说要下雨，你看果然下了。
    - 这纸花太漂亮了，简直跟真花一样。
    - 他绝对不会干这种事，我相信他。
    - 别人都能学会，难道我就学不会吗？
    - 大家以为他回国了，其实他去南方旅行了。
    - 你明天千万要早点儿回来。
- id: g3-20
  hsk: '3'
  code: 三20
  title: 由
  examples:
    - 这路公交车由北京机场出发。
    - 我们由南门进入公园。
- id: g3-21
  hsk: '3'
  code: 三21
  title: 自从
  examples:
    - 自从修了公路，这儿的交通就方便多了。
    - 自从来到中国，他就喜欢上了中国菜。
- id: g3-22
  hsk: '3'
  code: 三22
  title: 朝
  examples:
    - 大门朝南开。
    - 他朝左边看了一下儿。
    - 他朝我大喊：“小心！”
- id: g3-23
  hsk: '3'
  code: 三23
  title: 为
  examples:
    - 妈妈每天为我们做饭。
    - 他为我买了一束花。
- id: g3-24
  hsk: '3'
  code: 三24
  title: 向
  examples:
    - 我们要向班长学习。
    - 如果不能来上课，你要向老师请假。
- id: g3-25
  hsk: '3'
  code: 三25
  title: 由于、因为
  examples:
    - 由于各种原因，大家没有接受他的意见。
    - 他因为这件事一直不跟我说话。
- id: g3-26
  hsk: '3'
  code: 三26
  title: 为了
  examples:
    - 妈妈为了健康坚持每天跑步。
    - 他为了新工作不断学习新知识。
- id: g3-27
  hsk: '3'
  code: 三27
  title: 把、被、叫、让
  examples:
    - 我看见你把手机放在书包里了。
    - 裙子被我弄脏了。
    - 手机叫我弄坏了。
    - 我的车让朋友借走了。
- id: g3-28
  hsk: '3'
  code: 三28
  title: 除了
  examples:
    - 除了英文，他还会说中文。
    - 除了他，我们都是留学生。
- id: g3-29
  hsk: '3'
  code: 三29
  title: 按、按照
  examples:
    - 房租按天或者按月计算。
    - 他们按照地图找到了全部东西，顺利完成了任务。
- id: g3-30
  hsk: '3'
  code: 三30
  title: 连接分句或句子：并且、不光、不仅、另外、要是、因此、由于、只有
  examples:
    - 这星期我很忙，要上课，要准备考试，另外，还要参加一些学校活动。
    - 这次晚会他们准备了很多吃的、喝的，另外，还准备了不少礼物。
    - （“并且、不光、不仅、要是、因此、由于、只有”例句参见复句部分）
- id: g3-31
  hsk: '3'
  code: 三31
  title: 哈哈
  examples:
    - 我还没进门就听到同学们哈哈的声音了。
    - 听了他的话，我们都哈哈地笑了起来。
- id: g3-32
  hsk: '3'
  code: 三32
  title: 其他结构类型2
  examples:
    - （1）介宾短语
    - 在房间 从前边 往左 把他 按照规定
    - （2）方位短语
    - 教室里 桌子上边 学校的东边 起床后 睡觉以前
    - （3）兼语短语
    - 请他进来 叫他上车 通知他开会 建议大家休息
    - （4）同位短语
    - 我的朋友小张 他妈妈李老师 游泳这种运动
- id: g3-33
  hsk: '3'
  code: 三33
  title: 数量重叠：数词+量词+数词+量词
  examples:
    - 图书馆里放着一排一排的书架。
    - 老师让学生两个两个地进教室。
    - 妈妈一遍一遍地告诉我要注意安全。
    - 日子一天一天过去了。
- id: g3-34
  hsk: '3'
  code: 三34
  title: 不A不B
  examples:
    - 不大不小 不长不短 不冷不热 不多不少 不早不晚
- id: g3-35
  hsk: '3'
  code: 三35
  title: 看起来
  examples:
    - 这些苹果看起来很好吃。
    - 她工作了一天，看起来有点儿累。
- id: g3-36
  hsk: '3'
  code: 三36
  title: 看上去
  examples:
    - 这件衣服看上去很不错。
    - 那沙发看上去非常结实。
- id: g3-37
  hsk: '3'
  code: 三37
  title: 有的是
  examples:
    - 咱们图书馆有的是书，你可以多看看。
    - 这儿水果有的是，你多拿一点儿。
- id: g3-38
  hsk: '3'
  code: 三38
  title: 除了⋯⋯（以外），⋯⋯还/也/都⋯⋯
  examples:
    - 除了上课，我还要参加各种活动。
    - 除了我，我姐姐和弟弟也会说中文。
    - 除了北京以外，中国的其他城市我都没去过。
- id: g3-39
  hsk: '3'
  code: 三39
  title: 从⋯⋯起
  examples:
    - 从现在起，你要努力学习了。
    - 从今天起，我就用这台新电脑了。
- id: g3-40
  hsk: '3'
  code: 三40
  title: 对⋯⋯来说
  examples:
    - 对日本留学生来说，汉字不太难。
    - 对专家来说，这个问题很容易解决。
- id: g3-41
  hsk: '3'
  code: 三41
  title: 一……也/都+不/没⋯⋯
  examples:
    - 他一句中文也不会说。
    - 我上午一口水也没喝，现在渴极了。
    - 他一个汉字都不认识。
    - 这个公园我一次都没去过。
- id: g3-42
  hsk: '3'
  code: 三42
  title: 越⋯⋯越⋯⋯
  examples:
    - 中文越学越有意思。
    - 衣服的牌子越有名，价钱越贵。
- id: g3-43
  hsk: '3'
  code: 三43
  title: 动词或动词性短语、形容词或形容词性短语作主语
  examples:
    - 哭对身体有好处。
    - 早一点儿来比较合适。
    - 紧张有什么用？
    - 太冷了不好，太热了也不好。
- id: g3-44
  hsk: '3'
  code: 三44
  title: 动词或动词性短语、形容词或形容词性短语和主谓短语作宾语
  examples:
    - 我打算去上海。
    - 她喜欢安静。
    - 我感到不舒服。
    - 老师希望大家都能取得好成绩。
- id: g3-45
  hsk: '3'
  code: 三45
  title: 动词或动词性短语、主谓短语作定语
  examples:
    - 你看见那个跳舞的女孩儿了吗？
    - 观看演出的观众请从右边的门进去。
    - 小白讲的故事很有意思。
- id: g3-46
  hsk: '3'
  code: 三46
  title: 结果补语2：动词+到/住/走
  examples:
    - 他终于买到火车票了。
    - 我把球传给他，可是他没接住。
    - 那本书他取走了吗？
- id: g3-47
  hsk: '3'
  code: 三47
  title: 趋向补语2
  examples:
    - （1）复合趋向补语的趋向意义用法：动词+出来/出去/过来/过去/回来/回去/进来/进去/起来/上来/上去/下来/下去
    - 他从书包里拿了一本书出来。
    - 他从书包里拿出一本书来。
    - 他从书包里拿出来一本书。
    - 他慢慢地走出教室去了。
    - 汽车开过来了，咱们准备上车。
    - 他在桥那边，我们走过去吧。
    - 我昨天买回来了一些水果。
    - 这儿离学校很近，我们走回去吧。
    - 外边的桌子你搬进来了没有？
    - 桌子我还没搬进来。
    - 这些书不能放在外边，应该拿进去。
- id: g3-48
  hsk: '3'
  code: 三48
  title: 可能补语1：动词+得/不+动词/形容词；动词+得/不+了
  examples:
    - 老师的话我都听得懂。
    - 这件衣服太脏了，洗不干净了。
    - 明天的比赛你参加得了吗？
    - 我病了，明天上不了课。
- id: g3-49
  hsk: '3'
  code: 三49
  title: 程度补语1：形容词/心理动词+得很/极了/死了
  examples:
    - 我累得很。
    - 外面冷极了。
    - 这个游戏孩子们喜欢极了。
    - 他们今天忙死了。
- id: g3-50
  hsk: '3'
  code: 三50
  title: 数量补语3（动词+动量补语）：宾语和动量补语共现
  examples:
    - 我找了他两次。
    - 我来过中国一次。
    - 我去过两次上海。
    - 他读了三遍课文。
- id: g3-51
  hsk: '3'
  code: 三51
  title: 数量补语4（动词+时量补语）：表示动作持续的时间
  examples:
    - 我学中文学了两年。
    - 我学了两年中文。
    - 我等他等了半个多小时。
    - 我等了他半个多小时。
    - 他游泳游了四十分钟。
    - 他游了四十分钟的泳。
- id: g3-52
  hsk: '3'
  code: 三52
  title: 数量补语5（动词+时量补语）：表示动作结束后到某个时间点的间隔时间
  examples:
    - 他们来中国两个月了。
    - 哥哥去北京一个星期了。
    - 我父母结婚二十年了。
- id: g3-53
  hsk: '3'
  code: 三53
  title: 主谓句4：主谓谓语句
  examples:
    - 奶奶身体非常好。
    - 这件衣服颜色很好看。
    - 那本书我没看过。
    - 这电影我看了三遍了。
- id: g3-54
  hsk: '3'
  code: 三54
  title: “把”字句1：表处置
  examples:
    - （1）主语+把+宾语+动词+在/到+处所
    - 老师把书放在桌子上了。
    - 我把朋友送到车站了。
    - （2）主语+把+宾语1+动词（+给）+宾语2
    - 爸爸把新买的手机送妹妹了。
    - 他们把作业交给老师了。
    - （3）主语+把+宾语+动词+结果补语/趋向补语/状态补语
    - 你把书架上的书放整齐。
    - 他把洗好的衣服拿回来了。
    - 孩子们把手洗得干干净净的。
- id: g3-55
  hsk: '3'
  code: 三55
  title: 被动句1：主语+被/叫/让+宾语+动词+其他成分
  examples:
    - 那个手机早被我用坏了
    - 我的词典叫弟弟弄脏了
    - 他完全让这位姑娘迷住了。
- id: g3-56
  hsk: '3'
  code: 三56
  title: 连动句2
  examples:
    - （1）前一动作是后一动作的方式
    - 他笑着说：“没事儿。”
    - 我明天坐飞机去北京。
    - （2）后一动作是前一动作的目的
    - 他去超市买水果。
    - 我来中国学习中文。
- id: g3-57
  hsk: '3'
  code: 三57
  title: 兼语句1
  examples:
    - （1）表使令：主语+叫/派/请/让 …… +宾语1+动词+宾语2
    - 经理叫他介绍一下儿中国市场情况。
    - 公司派我来中国学习中文。
    - 我请他去我家玩儿。
    - 妈妈让我早点儿回国。
- id: g3-58
  hsk: '3'
  code: 三58
  title: 比较句4
  examples:
    - （1）A比B+动词+得+形容词
    - 我比他跑得快。
    - 我说中文比妹妹说得流利。
    - （2）A不比B+形容词
    - 我姐姐不比我高。
    - 这个笔记本不比那个大。
    - （3）A+动词+得+比+B+形容词
    - 我跑得比他快。
    - 姐姐中文说得比我流利。
    - （4）A比B+多/少/早/晚+动词+数量短语
    - 我比他多吃了五个饺子。
    - 他比我少买一个苹果。
- id: g3-59
  hsk: '3'
  code: 三59
  title: 重动词：主语+动词+宾语+动词+补语
  examples:
    - 他打篮球打得很好。
    - 她游泳游得很快。
    - 她走路走累了。
    - 我看电视看了两个小时。
- id: g3-60
  hsk: '3'
  code: 三60
  title: （也）⋯⋯，也⋯⋯
  examples:
    - 篮球他喜欢，排球他也喜欢。
    - 面条儿我也爱吃，米饭我也爱吃。
- id: g3-61
  hsk: '3'
  code: 三61
  title: 一会儿⋯⋯，一会儿⋯⋯
  examples:
    - 最近天气有点儿奇怪，一会儿冷，一会儿热。
    - 他们在晚会上一会儿唱歌，一会儿跳舞，玩儿得很开心。
- id: g3-62
  hsk: '3'
  code: 三62
  title: 一方面⋯⋯，另一方面⋯⋯
  examples:
    - 我们一方面要看到他们的优点，另一方面也要指出他们的缺点。
    - 他们在实习中一方面可以增加工作经验，另一方面可以学习新的知识。
- id: g3-63
  hsk: '3'
  code: 三63
  title: 又⋯⋯，又⋯⋯
  examples:
    - 晚会上大家又唱歌，又跳舞，高兴极了。
    - 这件衣服样子又好看，价格又便宜。
- id: g3-64
  hsk: '3'
  code: 三64
  title: 首先⋯⋯，然后⋯⋯
  examples:
    - 同学们首先读了一遍课文，然后认真地回答了黑板上的问题。
    - 我们首先要找到科学的练习方法，然后坚持每天练习。
- id: g3-65
  hsk: '3'
  code: 三65
  title: ⋯⋯，并且⋯⋯
  examples:
    - 专家们对这个问题进行了讨论，并且提出了解决办法。
    - 这种办法可以保存食物，并且能保存很久。
- id: g3-66
  hsk: '3'
  code: 三66
  title: 不仅/不光 ，还/而且
  examples:
    - 那个地方我不仅去过，还去过好几次呢。
    - 不光我会说中文，而且我姐姐也会说中文。
- id: g3-67
  hsk: '3'
  code: 三67
  title: 不是，就是⋯⋯
  examples:
    - 他不是在办公室，就是在实验室。
    - 这些衣服都不合适，不是太大，就是太小。
- id: g3-68
  hsk: '3'
  code: 三68
  title: ⋯⋯X 是 X，就是/不过⋯⋯
  examples:
    - 这件衣服好看是好看，就是有点儿贵。
    - 坐公交车方便是方便，不过人太多了。
- id: g3-69
  hsk: '3'
  code: 三69
  title: 要是⋯⋯，就⋯⋯
  examples:
    - 要是不开心，我就会大声唱歌。
    - 要是你明天有时间，就跟我一起去长城吧。
- id: g3-70
  hsk: '3'
  code: 三70
  title: 只有⋯⋯，才⋯⋯
  examples:
    - 只有认真检查，我们才会发现问题、解决问题。
    - 只有多听多说，你才能提高中文水平。
- id: g3-71
  hsk: '3'
  code: 三71
  title: （由于）⋯⋯，所以/因此⋯⋯
  examples:
    - 由于身体不好，所以爸爸打算提前退休。
    - 他工作很努力，因此取得了很大的成功。
- id: g3-72
  hsk: '3'
  code: 三72
  title: 为了⋯⋯，⋯⋯
  examples:
    - 为了保持健康，他每天坚持运动。
    - 为了学好中文，我每天都要看中国电视剧。
- id: g3-73
  hsk: '3'
  code: 三73
  title: ⋯⋯了⋯⋯（就）⋯⋯
  examples:
    - 他下了课就去图书馆。
    - 他喝了酒就会脸红。
- id: g3-74
  hsk: '3'
  code: 三74
  title: 概数表示法2
  examples:
    - （1）用“大概、大约、几”表示概数
    - 这个手机大概两千块。
    - 我的中文老师大约三十岁。
    - 我上网买了几本书。
    - （2）相邻数词连用表示概数
    - 三四（个） 十五六（岁） 七八十（个人） 五六百（块钱）
    - （3）用“左右、前后”表示概数
    - 三十岁左右 八点左右 春节前后 五一前后
- id: g3-75
  hsk: '3'
  code: 三75
  title: 用“一点儿也不⋯⋯”表示强调
  examples:
    - 中文一点儿也不简单。
    - 这双球鞋穿着一点儿也不舒服。
- id: g3-76
  hsk: '3'
  code: 三76
  title: 用反问句表示强调
  examples:
    - 反问句1：不是⋯⋯吗？/难道⋯⋯吗？
    - 今天不是星期天吗？
    - 难道你没去过长城吗？
- id: g3-77
  hsk: '3'
  code: 三77
  title: 用“是”强调
  examples:
    - 你说得对，这位经理是很负责。
    - 我同意，那电影是很有意思。
- id: g3-78
  hsk: '3'
  code: 三78
  title: 用疑问语调表示疑问
  examples:
    - 今天是星期六？
    - 你打算去旅行？
- id: g3-79
  hsk: '3'
  code: 三79
  title: 都⋯⋯了
  examples:
    - 都十一点了，你别看电视了。
    - 都三天了，他怎么还没回来？
- id: g3-80
  hsk: '3'
  code: 三80
  title: X就X（点儿）吧
  examples:
    - 慢就慢吧，他能完成任务就很不错了。
    - 忙就忙点儿吧，我们过几天就能休息了。
- id: g3-81
  hsk: '3'
  code: 三81
  title: X什么（啊）
  examples:
    - 玩儿什么，我们赶快工作吧。
    - 舒服什么啊，办公室空调坏了。
- id: g4-01
  hsk: '4'
  code: 四01
  title: 能愿动词：得
  examples:
    - 今天下课我得早点儿回家。
    - 时间不早了，我得回家了。
    - 你再忙也得好好吃饭啊！
- id: g4-02
  hsk: '4'
  code: 四02
  title: 人称代词：人家
  examples:
    - 人家也是为你好啊。
    - 人家现在有困难，咱们应该帮他。
    - 你看人家经常锻炼，身体多好。
- id: g4-03
  hsk: '4'
  code: 四03
  title: 名量词：打、袋、根、卷、棵、批
  examples:
    - 一打啤酒 一袋米 一根头发 一卷纸 一棵树 一批学生
- id: g4-04
  hsk: '4'
  code: 四04
  title: 借用量词
  examples:
    - （1）名量词：碗、脸、手、屋子、桌子
    - 一碗汤 一脸水 一手油 一屋子人 一桌子书
    - （2）动量词：刀、针
    - 切两刀 打一针
- id: g4-05
  hsk: '4'
  code: 四05
  title: 程度副词：格外、极、极其
  examples:
    - 老师今天格外开心。
    - 这些字极小，我都看不清楚。
    - 校长是一个极其负责的人。
- id: g4-06
  hsk: '4'
  code: 四06
  title: 范围、协同副词：共
  examples:
    - 共有三十人出席会议。
    - 这本书共十五课。
- id: g4-07
  hsk: '4'
  code: 四07
  title: 时间副词：按时、即将、急忙、渐渐、尽快
  examples:
    - 你要按时吃药。
    - 同学们即将毕业。
    - 快上课了，他急忙跑进教室。
    - 春天来了，天气渐渐暖和起来。
    - 你尽快给他回个电话。
- id: g4-08
  hsk: '4'
  code: 四08
  title: 频率、重复副词：一再、再三
  examples:
    - 他一再表示自己不会出席这次会议。
    - 我再三解释，他还是不相信。
- id: g4-09
  hsk: '4'
  code: 四09
  title: 关联副词：却
  examples:
    - 我来了，他却没来。
    - 同学们都出去活动了，他却坐在教室里面不动。
- id: g4-10
  hsk: '4'
  code: 四10
  title: 否定副词：未必
  examples:
    - 这个消息未必可靠，咱们再等等吧。
    - 别等了，他未必会来。
- id: g4-11
  hsk: '4'
  code: 四11
  title: 情态副词：几乎、似乎
  examples:
    - 他的话我几乎都没听懂。
    - 她似乎对自己的表现很不满意。
- id: g4-12
  hsk: '4'
  code: 四12
  title: 语气副词：的确、反而、竟然、究竟
  examples:
    - 这的确是我的错。
    - 风不但没停，反而越来越大。
    - 他还真有办法，问题马上就解决了。
    - 这道题很简单，同学们竟然都做错了。
    - 明天的晚会你究竟去不去？
- id: g4-13
  hsk: '4'
  code: 四13
  title: 自
  examples:
    - 自1978年以来，中国发生了很大的变化。
    - 我们的航班准时自北京出发。
- id: g4-14
  hsk: '4'
  code: 四14
  title: 对于
  examples:
    - 对于任何一种语言来说，文字的出现都是十分重要的。
    - 对于美术和音乐，她很有研究。
    - 对于这个问题，我们还得认真讨论。
- id: g4-15
  hsk: '4'
  code: 四15
  title: 关于
  examples:
    - 我读了几本关于环境保护的书。
    - 关于明天的考试，学校做了具体的规定。
    - 这是一部关于战争的电影。
- id: g4-16
  hsk: '4'
  code: 四16
  title: 替
  examples:
    - 你别替我担心了，我自己处理。
    - 取得这么好的成绩，大家都替你感到高兴。
- id: g4-17
  hsk: '4'
  code: 四17
  title: 根据
  examples:
    - 学校根据学生的中文水平分班。
    - 根据大家的意见，我们修改了计划。
- id: g4-18
  hsk: '4'
  code: 四18
  title: 作为
  examples:
    - 他作为教师代表参加了这次会议。
    - 作为学生，你应该按时完成作业。
- id: g4-19
  hsk: '4'
  code: 四19
  title: 连接词或词组：并、以及
  examples:
    - 他们同意并支持我们的建议。
    - 小王、小李以及另外三名同学都通过了考试。
- id: g4-20
  hsk: '4'
  code: 四20
  title: 连接分句或句子：此外、而、而是、既然、可见、甚至、假如、总之
  examples:
    - 我们要认真听讲，此外还要积极完成作业。
    - 为什么北方下雪越来越少，而南方下雪越来越多？
    - 听说重要，读写也很重要，总之，这四项能力都很重要。
    - （“而是、既然、可见、甚至、假如”例句参见复句部分）
- id: g4-21
  hsk: '4'
  code: 四21
  title: 其他助词：似的
  examples:
    - 她俩好像从来没见过似的。
    - 这里的景色像画儿似的。
    - 他的中文说得跟中国人似的。
- id: g4-22
  hsk: '4'
  code: 四22
  title: 啊
  examples:
    - 啊，你怎么在这里？
    - 啊，我明白了。
    - 啊！太美了！
- id: g4-23
  hsk: '4'
  code: 四23
  title: 大A大B
  examples:
    - 你这大吃大喝的毛病对身体不好，一定要改改。
    - 她心情不好，为一点儿小事就大吵大闹。
- id: g4-24
  hsk: '4'
  code: 四24
  title: 一A一B
  examples:
    - 这是别人的东西，我们一针一线都不能拿。
    - 他一五一十地把情况汇报给了老师。
- id: g4-25
  hsk: '4'
  code: 四25
  title: 看来
  examples:
    - 看来他是个好人。
    - 看来明天不会再下雨了。
    - 看来这次考试他能通过。
- id: g4-26
  hsk: '4'
  code: 四26
  title: 来得及/来不及
  examples:
    - 你别着急，时间来得及。
    - 现在刚六点半，你马上去还来得及。
    - 来不及了，我们快走吧。
    - 时间还早，不会来不及的。
- id: g4-27
  hsk: '4'
  code: 四27
  title: 说不定
  examples:
    - 下雨了，说不定他今天不来了。
    - 这件事说不定就是他干的。
    - 今年能不能去中国现在还说不定。
- id: g4-28
  hsk: '4'
  code: 四28
  title: 一般来说
  examples:
    - 一般来说，选手参加了比赛是不能退出的。
    - 一般来说，这么重要的场合他是不会迟到的。
    - 一般来说，跟青年人相比，老年人的经验更丰富。
- id: g4-29
  hsk: '4'
  code: 四29
  title: 一+量词+比+一+量词
  examples:
    - 这些球鞋一双比一双好看。
    - 他的演出一次比一次精彩。
    - 天气一天比一天暖和。
- id: g4-30
  hsk: '4'
  code: 四30
  title: （自）⋯⋯以来
  examples:
    - 自去年以来，我一直生活在北京。
    - 上大学以来，他一直坚持学习中文。
    - 自有了孩子以来，她每天都很忙。
- id: g4-31
  hsk: '4'
  code: 四31
  title: 由⋯⋯组成
  examples:
    - 我们班由两位老师和二十位学生组成。
    - 这篇文章由三个部分组成。
    - 这张试卷是由十道选择题和一道写作题组成的。
- id: g4-32
  hsk: '4'
  code: 四32
  title: 在⋯⋯方面
  examples:
    - 在这方面，我没有什么经验。
    - 在历史方面，他知道得很多。
    - 在修理电脑方面，她是个专家。
- id: g4-33
  hsk: '4'
  code: 四33
  title: 在⋯⋯上/下/中
  examples:
    - 在这件事情上，最好多听听父母的意见
    - 在他的影响下，我喜欢上了中文。
    - 在这篇课文中，我们一共学了三十个生词。
- id: g4-34
  hsk: '4'
  code: 四34
  title: 主谓短语作主语
  examples:
    - 他不去也可以。
    - 身体健康很重要。
    - 我参加中文水平考试是为了获得奖学金去中国留学。
- id: g4-35
  hsk: '4'
  code: 四35
  title: 受事主语
  examples:
    - 饭都吃光了。
    - 作业我做完了。
    - 这本书我已经看过三遍了。
- id: g4-36
  hsk: '4'
  code: 四36
  title: 多项定语
  examples:
    - 我有一条漂亮的红围巾。
    - 我那两件白色长衬衫放在哪里了？
    - 那位戴着眼镜的白头发高个子老人就是我们的校长。
- id: g4-37
  hsk: '4'
  code: 四37
  title: 趋向补语3
  examples:
    - （1）表示结果意义（引申用法）：动词+上/出/起/下
    - 请同学们离开教室时关上窗户。
    - 他向父母说出了自己的愿望。
    - 他终于想起了当时的情况。
    - 他们建立起了亲密的朋友关系。
    - 请留下你的地址和手机号。
- id: g4-38
  hsk: '4'
  code: 四38
  title: “把”字句2：表处置
  examples:
    - （1）主语+把+宾语+动词（+一/了）+动词
    - 同学们再把试卷检查检查。
    - 你把地扫扫，我把桌子擦一擦。
    - 他把冬天的衣服晒了晒，收在箱子里。
    - （2）主语+把+宾语（+给）+动词+了/着
    - 他把学过的生词都忘了。
    - 他拿不了了，你帮他把这些东西给拿着。
    - 你别忘了把护照带着。
    - （3）主语+把+宾语+动词+动量补语/时量补语
    - 老师把他批评了一顿。
    - 他把文章读了好几遍。
    - 他把这个问题认真地考虑了好几天。
- id: g4-39
  hsk: '4'
  code: 四39
  title: 被动句2：主语+被+动词+其他成分
  examples:
    - 王老师被请去开会了。
    - 教室的灯早就被关上了。
    - 那张画儿被买走了。
- id: g4-40
  hsk: '4'
  code: 四40
  title: 存现句2
  examples:
    - （1）表示出现：处所词+动词+趋向补语/结果补语+动态助词（了）+数量短语+人/物
    - 前边开来一辆车。
    - 我家昨天来了几位客人，带了不少礼物。
    - 对面走来一位老人。
    - 教室里走出来一位老师。
    - （2）表示消失：处所词+动词+结果补语+动态助词（了）+数量短语+人/物
    - 我们班里转走了一个学生。
    - 阳台上吹跑了一条裙子。
    - 院子里搬走了两家人。
    - 公司调走了几名员工。
- id: g4-41
  hsk: '4'
  code: 四41
  title: 兼语句2
  examples:
    - （1）表爱憎义：主语+表扬/批评+宾语1+动词+宾语2
    - 老师表扬他帮助同学。
    - 妈妈总是批评我不整理房间。
    - （2）表称谓或认定义：主语+叫/称（呼）/说/收/选+宾语1+做/为/当/是+宾语2
    - 大家都称他为先生。
    - 老师们都说她是好学生。
    - 王教授收我做研究生。
    - 同学们都选他当班长。
- id: g4-42
  hsk: '4'
  code: 四42
  title: “是⋯⋯的”句2：强调说话人的看法或态度
  examples:
    - 这个问题是可以解决的。
    - 这道题是很简单的。
    - 那样的事情是绝对不会发生的。
- id: g4-43
  hsk: '4'
  code: 四43
  title: 不是⋯⋯，而是⋯⋯
  examples:
    - 我不是不想去，而是没时间。
    - 这不是我的书，而是他的。
    - 这件事错的不是我，而是他。
- id: g4-44
  hsk: '4'
  code: 四44
  title: 既⋯⋯，又/也⋯⋯
  examples:
    - 这件新衣服既好看，又暖和。
    - 他既会学习，又会玩儿。
    - 他既是我们的老师，也是我们的朋友。
- id: g4-45
  hsk: '4'
  code: 四45
  title: 首先⋯⋯，其次⋯⋯
  examples:
    - 首先我们要读一遍课文，其次我们要根据课文做一个练习。
    - 我们球队问题很多，首先是队员不够团结，其次是训练时间很短。
    - 评价一个学生，首先看品质，其次看成绩。
- id: g4-46
  hsk: '4'
  code: 四46
  title: ⋯⋯，于是⋯⋯
  examples:
    - 风停了，下起雨来，于是人们纷纷打起了雨伞。
    - 他不喜欢这个工作，于是离开了这家公司。
    - 离开会的时间还早，于是我们去逛了逛书店。
- id: g4-47
  hsk: '4'
  code: 四47
  title: ⋯⋯，甚至⋯⋯
  examples:
    - 他什么都不会，甚至连最简单的汉字也写不了。
    - 她病得很严重，甚至要做手术。
    - 妈妈真的很生气，甚至晚饭都没有吃。
- id: g4-48
  hsk: '4'
  code: 四48
  title: 或者⋯⋯，或者⋯⋯
  examples:
    - 这件事或者赶快停止，或者重新开始。
    - 暑假或者去上海，或者去杭州，反正得出去旅行。
    - 咱们三个人，或者你去，或者我去，或者他去，谁去都可以。
- id: g4-49
  hsk: '4'
  code: 四49
  title: ⋯⋯， 然而⋯⋯
  examples:
    - 我知道中文很有用，然而中文也太难了。
    - 他说他不喜欢这部电影，然而我觉得很有意思。
- id: g4-50
  hsk: '4'
  code: 四50
  title: ⋯⋯，否则⋯⋯
  examples:
    - 我要认真复习，否则考试会不及格的。
    - 记得带卡，否则进不了办公室。
    - 上课前一定要预习好生词和课文，否则就听不懂老师讲的。
- id: g4-51
  hsk: '4'
  code: 四51
  title: 假如⋯⋯，（就）⋯⋯
  examples:
    - 假如有困难，你一定要告诉我。
    - 假如能通过这个考试，我就可以拿到学校的奖学金了。
- id: g4-52
  hsk: '4'
  code: 四52
  title: 万一⋯⋯，（就）⋯⋯
  examples:
    - 万一我没来，你就自己先去吧。
    - 一定要把你们的护照带上，万一需要，没带就麻烦了。
- id: g4-53
  hsk: '4'
  code: 四53
  title: 不管⋯⋯，都/也⋯⋯
  examples:
    - 不管明天是否下雨，我都要去看他。
    - 不管有多难，我也会坚持学下去。
- id: g4-54
  hsk: '4'
  code: 四54
  title: 无论⋯⋯，者15/也⋯⋯
  examples:
    - 无论学习多么紧张，我都坚持每天锻炼一个小时。
    - 无论他怎么说，也没有人相信他。
- id: g4-55
  hsk: '4'
  code: 四55
  title: 既然⋯⋯，就⋯⋯
  examples:
    - 既然这事你已经决定了，我就不说什么了。
    - 既然外面下雨了，我们就明天再去吧。
- id: g4-56
  hsk: '4'
  code: 四56
  title: ⋯⋯ ，可见 ⋯⋯
  examples:
    - 他的中文水平很高，可见他在留学期间学习是多么努力。
    - 他在我困难的时候一直帮助我，可见他是我多么好的朋友。
- id: g4-57
  hsk: '4'
  code: 四57
  title: 哪怕 ⋯⋯ ，也/还 ⋯⋯
  examples:
    - 哪怕明天下雨，足球比赛也要继续进行。
    - 哪怕再难，我也要坚持学下去。
    - 哪怕机会不大，我还是要去试一试。
- id: g4-58
  hsk: '4'
  code: 四58
  title: ⋯⋯，好⋯⋯
  examples:
    - 老师布置了听写作业，好帮助学生练习汉字。
    - 我们应该不断地引导他，好让他对自己有信心。
    - 她每天都给家里打电话，好让父母放心。
- id: g4-59
  hsk: '4'
  code: 四59
  title: 无标记
  examples:
    - 你有事你先走。
    - 你不怕我怕。
    - 你想去你去。
- id: g4-60
  hsk: '4'
  code: 四60
  title: 不⋯⋯也⋯⋯
  examples:
    - 今天晚上我不睡觉也要把这篇作文写完。
    - 他不吃饭也要帮我修电脑。
    - 他不休息也要玩儿手机游戏。
- id: g4-61
  hsk: '4'
  code: 四61
  title: 概数表示法3：数词+来+量词
  examples:
    - 十来本 五十来斤 一百来辆
- id: g4-62
  hsk: '4'
  code: 四62
  title: 小数、分数、百分数、倍数的表示法
  examples:
    - 零点三 三分之二 百分之五十 五倍
    - 这一百个汉字，我认识三分之二。
    - 这支笔的价格比原来降低了百分之五十。
    - 三班男生人数是女生人数的三倍。
- id: g4-63
  hsk: '4'
  code: 四63
  title: 用反问句表示强调
  examples:
    - （1）反问句2：由疑问代词构成的反问句
    - 他这么有名，谁不知道啊？
    - 他去哪儿，我怎么会知道呢？
    - 作业这么多，我哪儿有时间出去玩儿？
- id: g4-64
  hsk: '4'
  code: 四64
  title: 用双重否定表示强调
  examples:
    - 没有孩子不喜欢玩儿。
    - 这么重要的活动我不可能不参加。
    - 老师不会不答应我们的请求。
    - 我们家没有不喜欢唱歌的。
- id: g4-65
  hsk: '4'
  code: 四65
  title: 用“一+量词（+名词）+也（都）/也没（不）⋯⋯”表示强调
  examples:
    - 我一本中文书也没看过。
    - 我累得一步路都走不动了。
    - 上海我一次也没去过。
    - 刚来中国时，他一句中文也听不懂。
- id: g4-66
  hsk: '4'
  code: 四66
  title: 用 "连⋯⋯也/都⋯⋯”表示强调
  examples:
    - 他连这个作家的名字也没听说过。
    - 我连最简单的汉字都写不出来。
- id: g4-67
  hsk: '4'
  code: 四67
  title: 不X白不X
  examples:
    - 今天班长请客，咱们不吃白不吃。
    - 这个电影是免费的，我们为什么不去看电影？不看白不看。
- id: g4-68
  hsk: '4'
  code: 四68
  title: 动词+一X是一X
  examples:
    - 虽然日子过得很难，但也不能过一天是一天。
    - 事情实在太多了，能做一件是一件吧。
    - 做一道题是一道题，你一定能做完。
- id: g4-69
  hsk: '4'
  code: 四69
  title: （没）有什么（好）X的
  examples:
    - 这才刚刚开始，没有什么好激动的。
    - 你还是别担心了，有什么好害怕的。
    - 有什么好难过的，这是我们早就想到的结果。
- id: g4-70
  hsk: '4'
  code: 四70
  title: X是X，Y是Y
  examples:
    - 一是一，二是二，这要分清楚。
    - 他是他，我是我，意见不同很正常。
    - 昨天是昨天，今天是今天，你得交作业。
- id: g4-71
  hsk: '4'
  code: 四71
  title: X也得X，不X也得X
  examples:
    - 这件事很重要，你做也得做，不做也得做。
    - 你吃也得吃，不吃也得吃，不能浪费粮食。
    - 都病成这样了，医院你去也得去，不去也得去。
- id: g4-72
  hsk: '4'
  code: 四72
  title: X就是了
  examples:
    - 你别浪费时间了，直接说就是了。
    - 你不要生气，以后别跟他说话就是了。
- id: g4-73
  hsk: '4'
  code: 四73
  title: 还X呢
  examples:
    - 还名牌儿呢，我听都没听过。
    - 还有名的专家呢，这水平还没我高。
    - 还著名诗人呢，这诗写的我都看不懂。
- id: g4-74
  hsk: '4'
  code: 四74
  title: 你X你的吧
  examples:
    - 你吃你的吧，别给我留。
    - 没有什么事，你休息你的吧！
    - 你忙你的吧，我跟孩子玩儿一会儿。
- id: g4-75
  hsk: '4'
  code: 四75
  title: 让/叫你X你就X
  examples:
    - 让你做你就做，别多问了。
    - 叫你吃你就吃，其他的你别管。
    - 计你安静你就安静，别那么多话。
- id: g4-76
  hsk: '4'
  code: 四76
  title: 说什么/怎么（着）也得X
  examples:
    - 他生病了，我说什么也得去看看他。
    - 这么重要的活动，你怎么也得来一下儿。
    - 没时间了，说什么也得走了。
- id: g5-01
  hsk: '5'
  code: 五01
  title: 指示代词：彼此、如此
  examples:
    - 朋友之间应该彼此信任。
    - 我们是多年的好朋友，不分彼此。
    - 十年后，两座城市的发展状况如此不同。
    - 他如此认真地锻炼是为了有个健康的身体。
- id: g5-02
  hsk: '5'
  code: 五02
  title: 名重词：册、朵、幅、届、颗、匹、扇
  examples:
    - 一册书 一朵花 一幅画 一届学生 一颗糖 一匹布 一扇窗户
- id: g5-03
  hsk: '5'
  code: 五03
  title: 程度副词：过于、可、稍、稍微、尤其
  examples:
    - 这件事发生得过于突然了。
    - 他女朋友可漂亮了！
    - 这幅画再挂得稍高一点儿。
    - 稍微坚持一下儿，马上就结束了。
    - 她喜欢运动，尤其是游泳。
- id: g5-04
  hsk: '5'
  code: 五04
  title: 范围副词：大都
  examples:
    - 参加划船比赛的大都是女生。
    - 我们班的学生大都很爱学习。
    - 小孩儿大都喜欢吃甜的。
- id: g5-05
  hsk: '5'
  code: 五05
  title: 时间副词：不时、将、将要、仍旧、时常、时刻、依旧、一向
  examples:
    - 我不时想起过去的事情。
    - 明年我们将去国外考察。
    - 电视剧将要开始了。
    - 二十年过去了，他仍旧没结婚。
    - 长大以后，我时常怀念我的故乡。
    - 在国外，我时刻想念着国内的亲人。
    - 十年过去了，他依旧住在那里。
    - 他一向不爱说话。
- id: g5-06
  hsk: '5'
  code: 五06
  title: 频率、重复副词：偶尔、再次
  examples:
    - 他不常请假，只是偶尔迟到一次。
    - 我们决不让类似的事情再次发生。
- id: g5-07
  hsk: '5'
  code: 五07
  title: 方式副词：偷偷
  examples:
    - 我偷偷送给他一件礼物。
    - 她偷偷地从窗户向外看。
- id: g5-08
  hsk: '5'
  code: 五08
  title: 语气副词：毕竟、不免、差（一）点儿、倒是、干脆、就、居然、可、明明、总算
  examples:
    - 不要怪他，他毕竟还小。
    - 第一次参加考试，不免有些紧张。
    - 我今天上学差点儿迟到。
    - 这种做法倒是怪新鲜的，从来没见过。
    - 这个人不讲道理，我们干脆不和他合作了。
    - 别劝我，我就要去。
    - 没想到，这件事居然是她干的。
    - 我可记不住这么多生词。
    - 明明是你做的，为什么要说是别人做的？
    - 这本书总算学完了。
- id: g5-09
  hsk: '5'
  code: 五09
  title: 随着
  examples:
    - 随着时间的推进，我慢慢理解了他的做法。
    - 随着冬天的到来，房间越来越冷。
- id: g5-10
  hsk: '5'
  code: 五10
  title: 将
  examples:
    - 父母将他送到中国留学。
    - 禁止将书带出阅览室。
- id: g5-11
  hsk: '5'
  code: 五11
  title: 由
  examples:
    - 这道题由你来回答吧。
    - 这件事情由班长负责。
- id: g5-12
  hsk: '5'
  code: 五12
  title: 凭
  examples:
    - 凭他的水平，通过这次考试没有问题。
    - 凭经验进行判断往往是不准确的。
- id: g5-13
  hsk: '5'
  code: 五13
  title: 依据
  examples:
    - 要依据事实办事。
    - 警察依据线索抓住了坏人。
- id: g5-14
  hsk: '5'
  code: 五14
  title: 依照
  examples:
    - 他想依照自己喜欢的方式去生活。
    - 依照学校的规定，学生要按时上课，不能迟到。
- id: g5-15
  hsk: '5'
  code: 五15
  title: 连接分句或句子：从而、加上、完了、一旦
  examples:
    - 他努力学习，从而实现了当翻译的理想。
    - 今天天气不太好，加上你还有很多作业，我们还是别去公园了吧。
    - 你快点儿写作业，完了我们去公园玩儿。
    - 你要想好了，一旦选择了就不能放弃。
- id: g5-16
  hsk: '5'
  code: 五16
  title: 其他助词：也好
  examples:
    - 让他亲自在现场试一试也好。
    - 你来也好，不来也好，随便吧。
    - 多学一门语言也好，将来可以凭此找份工作。
- id: g5-17
  hsk: '5'
  code: 五17
  title: A来A去
  examples:
    - 想来想去，还是小王最合适。
    - 大家讨论来讨论去，最后还是没解决。
    - 她是一名导游，经常在世界各地飞来飞去。
- id: g5-18
  hsk: '5'
  code: 五18
  title: A着A着
  examples:
    - 她说着说着就哭起来了。
    - 我躺在床上看电视，看着看着就睡着了。
- id: g5-19
  hsk: '5'
  code: 五19
  title: 没A没B
  examples:
    - 一上午没吃没喝，我要饿死了。
    - 这孩子说话没大没小的，一点儿礼貌都没有。
- id: g5-20
  hsk: '5'
  code: 五20
  title: 说A就A
  examples:
    - 为什么人生需要有一次说走就走的旅行？
    - 说干就干，只有干才能找到办法。
- id: g5-21
  hsk: '5'
  code: 五21
  title: 有A有B
  examples:
    - 下课了，同学们有说有笑地走出了教室。
    - 这里的农村有山有水，空气好，农民们过上了好日子。
    - 节日的公园里有男有女，有老有少，十分热闹。
- id: g5-22
  hsk: '5'
  code: 五22
  title: 不得了
  examples:
    - 你又考了第一名，真是不得了！
    - 不得了了，房间里进水了。
    - 完了完了，不得了了，电脑坏了。
- id: g5-23
  hsk: '5'
  code: 五23
  title: 不敢当
  examples:
    - 这样的奖励我真是不敢当。
    - 不敢当，我只是做了我应该做的事情。
    - 您千万别这样说，我实在是不敢当。
- id: g5-24
  hsk: '5'
  code: 五24
  title: 得了
  examples:
    - 麻烦别人还不如你自己去得了。
    - 得了吧，他不可能帮助别人的。
    - 你可得了吧，谁能这么想呢？
- id: g5-25
  hsk: '5'
  code: 五25
  title: 用不着
  examples:
    - 你有话可以直接说，用不着害怕。
    - 用不着听他的，他什么都不懂。
    - 孩子们都工作了，您用不着担心了。
- id: g5-26
  hsk: '5'
  code: 五26
  title: 从⋯⋯来看
  examples:
    - 从这个角度来看，很多问题都可以解决。
    - 从他的考试成绩来看，他平时根本没有认真学习。
    - 从以往的经验来看，这件事基本上没有问题。
- id: g5-27
  hsk: '5'
  code: 五27
  title: 到⋯⋯为止
  examples:
    - 到目前为止，他还没有舟过什么错。
    - 我的报告到此为止，谢谢！
    - 到昨天为止，这个项目已经完成了一半。
- id: g5-28
  hsk: '5'
  code: 五28
  title: 够⋯⋯的
  examples:
    - 眼前这几件事就够他忙的了。
    - 他可真够聪明的，竟然抓住了这个机会。
    - 这本书够难的，他肯定看不懂。
- id: g5-29
  hsk: '5'
  code: 五29
  title: 拿⋯⋯来说
  examples:
    - 拿成绩来说，他绝对是第一。
    - 拿这件事来说，你没有做错什么。
    - 拿这次考试来说，只要平时努力就能通过。
- id: g5-30
  hsk: '5'
  code: 五30
  title: A的A，B的B
  examples:
    - 衣服大的大，小的小，没有一件合适的。
    - 家里老的老，少的少，我们得帮帮她。
    - 这里的建筑高的高，低的低，不太整齐。
- id: g5-31
  hsk: '5'
  code: 五31
  title: 在 …… 看来
  examples:
    - 在我看来，这次中文考试实在是太难了。
    - 在很多人看来，这件事没有那么简单。
    - 在老师看来，每一个学生都有自已的优点。
- id: g5-32
  hsk: '5'
  code: 五32
  title: 宾语的语义类型1
  examples:
    - （1）施事宾语
    - 家里来了一位客人。
    - 门口站着一个人。
    - 台上坐着很多领导。
    - （2）受事宾语
    - 你们要认真对待这个考试。
    - 我们要去超市采购一批食品。
- id: g5-33
  hsk: '5'
  code: 五33
  title: 多项状语
  examples:
    - 他昨天在教室里认真地写完了作业。
    - 她为了通过考试昨天在家复习了一整天。
    - 我前天在路上意外地碰见了多年没见的老朋友。
    - 我们下午在教室里都非常认真地对昨天的报告进行了讨论。
- id: g5-34
  hsk: '5'
  code: 五34
  title: 趋向补语 4：表示时间意义（引申用法）
  examples:
    - （1）表示动作行为的开始：动词+上/起来
    - 这孩子又玩儿上游戏了。
    - 他大声地哭起来了。
    - 这项工作上个月就干起来了。
    - （2）表示动作行为的持续：动词+下去/下来
    - 别紧张，你说下去。
    - 你这样坚持下去一定能成功。
    - 你的中文说得不错，我建议你继续学下去。
    - 在这三年里，我把每天锻炼一个小时的习惯保持下来了。
- id: g5-35
  hsk: '5'
  code: 五35
  title: 可能补语2：动词+得/不得
  examples:
    - 这种药吃得还是吃不得，得听医生的。
    - 这些东西你可拿不得，很危险的。
    - 这种没有原则的话可说不得。
- id: g5-36
  hsk: '5'
  code: 五36
  title: 程度补语2
  examples:
    - （1）形容词/心理动词+得+不得了/慌/厉害
    - 爸爸答应去公园，儿子开心得不得了。
    - 我只是累得慌，休息休息就好了。
    - 听说要打针，她害怕得厉害。
    - （2）动词/形容词+坏/透+了
    - 这么晚了孩子还没回家，张老师担心坏了。
    - 这件事已经伤透了她的心，大家不要再提起。
    - 第一次被别人拒绝，我心情坏透了。
- id: g5-37
  hsk: '5'
  code: 五37
  title: 状态补语2：动词/形容词+得+短语
  examples:
    - （1）动词/形容词+得+动词短语
    - 他难过得吃不下饭。
    - 她气得说不出话来。
    - 她伤心得哭了起来。
    - （2）动词/形容词+得+主谓短语
    - 我早上没吃饭，饿得肚子疼。
    - 房间里热得人头痛。
    - 孩子得了冠军，父母乐得嘴都合不了。
    - （3）动词/形容词+得+固定短语
    - 第一次看到雪，我激动得又哭又笑。
    - 女儿半夜还没回来，妈妈在房间里急得走来走去。
    - 明天就是儿子的婚礼，父母高兴得跑前跑后。
- id: g5-38
  hsk: '5'
  code: 五38
  title: “有”字句3
  examples:
    - （1）表示存在、具有：主语+有+着+宾语
    - 两个国家之间有着长期的友好关系。
    - 他们之间有着很深的误会。
    - （2）表示附着：主语+动词+有+宾语
    - 书上写有他的名字。
    - 这双筷子上刻有漂亮的图案。
    - 发票上列有商品的名称。
- id: g5-39
  hsk: '5'
  code: 五39
  title: “把”字句3：表处置
  examples:
    - （1）主语+把+宾语+状语+动词
    - 他总是把东西到处乱扔。
    - 下雨了，她赶紧把外面的东西往回收。
    - （2）主语+把+宾语+一+动词
    - 她把东西一放，转身就走了。
    - 老师把门一关，开始上课了。
    - （3）主语+把+宾语+动词+了
    - 你怎么把这件事忘了？
    - 双方把合同签了。
    - （4）主语+把+宾语1+动词+宾语2
    - 他把身上的钱交学费了。
    - 我父母把存款买了房。
- id: g5-40
  hsk: '5'
  code: 五40
  title: 被动句3：意念被动句
  examples:
    - 蛋糕吃光了。
    - 衣服穿破了。
    - 车票卖完了。
- id: g5-41
  hsk: '5'
  code: 五41
  title: 连动句3：前后两个动词性词语具有因果、转折、条件关系
  examples:
    - 李老师生病住院了。
    - 这本书她借了没看。
    - 她有办法解决问题。
- id: g5-42
  hsk: '5'
  code: 五42
  title: 兼语句3
  examples:
    - （1）表致使：主语+叫/令/使/让+人称代词+动词短语
    - 老师叫她早点儿回去。
    - 这件事令她吃不下饭。
    - 他的做法使大家再也不敢相信他了。
    - 明天的考试让我睡不着觉。
- id: g5-43
  hsk: '5'
  code: 五43
  title: 比较句5
  examples:
    - （1）跟⋯⋯相比
    - 跟上次考试相比，这次没有那么难。
    - 跟别人相比，我的想法太简单了。
    - 跟语法知识相比，我觉得语音知识更难。
    - （2）A+形容词+B+数量补语
    - 她高我五厘米。
    - 他早我十分钟。
    - 姐姐大我十岁。
- id: g5-44
  hsk: '5'
  code: 五44
  title: 或是⋯⋯，或是⋯⋯
  examples:
    - 这件事或是哥哥做的，或是弟弟做的。
    - 你或是参加这次考试，或是明年再学一遍这门课。
- id: g5-45
  hsk: '5'
  code: 五45
  title: 尽管⋯⋯，名声/可是⋯⋯
  examples:
    - 尽管这次考试很难，但是很多人都通过了。
    - 尽管外面在下雨，可是他一定要去超市买东西。
    - 尽管他不接受我的意见，可是我有意见还是要向他提。
- id: g5-46
  hsk: '5'
  code: 五46
  title: 一旦⋯⋯，就⋯⋯
  examples:
    - 一旦考试不及格，我就要延期毕业了。
    - 一旦地铁建成，堵车的情况就可大大缓解。
    - 中文一旦学起来，就再也放不下了。
- id: g5-47
  hsk: '5'
  code: 五47
  title: 要是⋯⋯，（就）⋯⋯，否则⋯⋯
  examples:
    - 要是他不去，我也不去了，否则我一个人去太危险了。
    - 要是明天下雨，我们就不去爬山了，否则会冻感冒的。
    - 要是你不带包，我就带一个，否则买的东西没地方放。
- id: g5-48
  hsk: '5'
  code: 五48
  title: 除非⋯⋯，才⋯⋯
  examples:
    - 除非你答应我，我才和你一起去。
    - 除非你努力学习，才有可能考上大学。
    - 除非心情好，他才会答应我们的要求。
- id: g5-49
  hsk: '5'
  code: 五49
  title: 除非⋯⋯，否则/不然⋯⋯
  examples:
    - 除非坐飞机去，否则肯定来不及了。
    - 除非你仔细检查，不然太容易舟错了。
- id: g5-50
  hsk: '5'
  code: 五50
  title: ⋯⋯，因而⋯⋯
  examples:
    - 他生病了，因而没来上课。
    - 她按时完成了任务，因而受到公司的奖励。
    - 这次考试太难了，因而很多学生都没有通过。
- id: g5-51
  hsk: '5'
  code: 五51
  title: 即使⋯⋯，也⋯⋯
  examples:
    - 即使天气不好，爬长城的人也不会少。
    - 他即使生病了，也坚持工作。
    - 我即使睡得再晚，早上六点也准醒。
- id: g5-52
  hsk: '5'
  code: 五52
  title: ⋯⋯，为的是⋯⋯
  examples:
    - 我把车停在外面，为的是走的时候方便。
    - 她给你发这个信息，为的是提醒你注意安全。
    - 老师这节课什么也没讲，为的是让我们有时间多练习口语。
- id: g5-53
  hsk: '5'
  code: 五53
  title: ⋯⋯，以便⋯⋯
  examples:
    - 我们要早一点儿出门，以便乘坐第一班公交车。
    - 她每天步行上班，以便锻炼身体。
    - 把手机号留下吧，以便跟你联系。
- id: g5-54
  hsk: '5'
  code: 五54
  title: 没有⋯⋯就没有⋯⋯
  examples:
    - 没有你的帮助就没有我的成功。
    - 没有水就没有生命的存在。
    - 没有平时的努力就没有今天的成绩。
- id: g5-55
  hsk: '5'
  code: 五55
  title: 再⋯⋯也⋯⋯
  examples:
    - 这件事再难也要坚持下去。
    - 雨下得再大我也要去上班。
    - 这篇课文再长也要读完。
- id: g5-56
  hsk: '5'
  code: 五56
  title: 二重复句1：单句+复句；复句+单句
  examples:
    - 我决定去中国留学，即使中文再难我也要去学。
    - 因为生病所以我没去上课，没想到的是老师一下课就来看我了。
    - 她一直不愿意说出真相，虽然我不知道她的真实想法，但我尊重她的选择。
- id: g5-57
  hsk: '5'
  code: 五57
  title: 用“再也不/没”表示强调
  examples:
    - 从今天开始，我再也不会出这种错了。
    - 他再也没跟我联系过。
    - 我再也没见过她。
- id: g5-58
  hsk: '5'
  code: 五58
  title: 用副词“可”表示强调
  examples:
    - 你可来了，急死我了！
    - 你可得注意身体呀，天天睡眠不足可不行！
    - 你可不能让大家失望！
- id: g5-59
  hsk: '5'
  code: 五59
  title: 用“怎么都/也+不/没”表示强调
  examples:
    - 她怎么都没想到自己会失败。
    - 他怎么也不会猜到谁要来看望他。
    - 他的话我怎么都听不懂。
    - 昨天晚上我怎么也睡不着。
- id: g5-60
  hsk: '5'
  code: 五60
  title: X也不是，Y也不是
  examples:
    - 他这样开玩笑，气得我哭也不是，笑也不是。
    - 一看来了这么多人，他紧张得坐也不是，站也不是。
    - 走也不是，留也不是.真不知道怎么办好。
- id: g5-61
  hsk: '5'
  code: 五61
  title: X也X不得，Y也Y不得
  examples:
    - 他腰疼起来的时候站也站不得，坐也坐不得。
    - 孩子大了，骂也骂不得，打也打不得。
    - 这件事愁得他吃也吃不得，睡也睡不得。
- id: g5-62
  hsk: '5'
  code: 五62
  title: X是它，Y也是它
  examples:
    - 好是它，坏也是它，你没有别的选择。
    - 成功是它，失败也是它，这个选择我绝对不后悔。
    - 等一个小时是它，等两个小时也是它，只能坐这一班车回家了。
- id: g5-63
  hsk: '5'
  code: 五63
  title: X着也是X着
  examples:
    - 明天我去超市逛逛，反正闲着也是闲着。
    - 那些衣服她不喜欢了，放着也是放着，不如送人吧。
    - 反正等着也是等着，我们不如休息休息吧。
- id: g5-64
  hsk: '5'
  code: 五64
  title: X归X，Y归Y
  examples:
    - 想归想，做归做，结果完全不一样。
    - 吵归吵，闹归闹，大家还是好朋友。
    - 朋友归朋友，生意归生意，不能免费。
- id: g5-65
  hsk: '5'
  code: 五65
  title: 不管怎样说
  examples:
    - 不管怎样说，你这么做就是不对的。
    - 不管怎样说，这事总算办成了。
- id: g5-66
  hsk: '5'
  code: 五66
  title: 看你X的/瞧他X的
  examples:
    - 看你说的，我哪有那么能干？
    - 甲：他说他这次准考第一。
    - 乙：瞧他吹的。
- id: g5-67
  hsk: '5'
  code: 五67
  title: 真有你/他/她的
  examples:
    - 真有你的！电脑你也会修？
    - 这么难的事情他都有办法，真有他的！
- id: g5-68
  hsk: '5'
  code: 五68
  title: X什么X
  examples:
    - 看什么看，再看就迟到了！
    - 吃什么吃，再吃就胖死了！
- id: g5-69
  hsk: '5'
  code: 五69
  title: 什么X不X（的）
  examples:
    - 什么钱不钱的，你这话说的太客气了。
    - 什么麻烦不麻烦，我们之间不用这么客气。
    - 什么合适不合适的，衣服能穿就行。
- id: g5-70
  hsk: '5'
  code: 五70
  title: 用代词复指
  examples:
    - （1）用人称代词复指
    - 这个小伙子是我们学校的英国留学生。传来中国之前，在英国学过一点儿中文，他觉得中文很有意思。去年公司派他来中国学习中文，现在还想让他留在中国工作。
    - 网络对我们的生活越来越重要。它随时告诉我们每天世界各地发生的新闻，很多人不出门就能通过它买东西、跟朋友交流，它让生活变得越来越方便。
    - （2）用指示代词复指
    - 中国的南方人喜欢喝一种酒。这种酒是用米做的，味道甜甜的，大人小孩儿都能喝。这也是北方人去南方旅行之后喜欢买的东西之一。
    - 我的家乡在中国的南方。那是一个小城市，景色很漂亮，很适合旅游。我在那儿出生、长大，一直到十六岁才离开。那也是我最喜欢的城市。
    - （3）各种代词相间使用
    - 《现代汉语词典》一书是中国语言研究人员多年的成果，2016年9月出版了第7版。这不仅是全世界华人学习现代汉浯最重要的词典之一，同时也被称为世界上许多国家和地区的人们研究和学习中文的“标准”。至今，《现代汉语词典》除了中国版以外，还拥有多个国外版。它的出版，对促进国内外学术交流和合作起到了积极的作用。
- id: g5-71
  hsk: '5'
  code: 五71
  title: 带省略成分
  examples:
    - （1）省略主语
    - （我）决定出国留学，我不得不和父母告别，想到以后再也没有人保护我、关心我，（我）心里有些担心。离开家乡的那一天，亲人们都来机场送我，（我）带着他们的祝福和希望，我登上了前往北京的航班，开始了我的留学生活。
    - （2）省略宾语
    - 世界上任何事物都永远在运动、变化、发展，语言也是。语言的变化，包括语音、词汇和语法，短时间内不容易发现（这些变化），日子长了就表现出来了。
- id: g6-01
  hsk: '6'
  code: 六01
  title: 超-、多-、反-、无-、亚-、准
  examples:
    - 超自然 多角度 反作用 无烟 无健康 准妈妈
- id: g6-02
  hsk: '6'
  code: 六02
  title: '-化、-式、-型、-性'
  examples:
    - 现代化 美式 小型 普遍性
- id: g6-03
  hsk: '6'
  code: 六03
  title: 指示代词：本、此
  examples:
    - 本市 本人 此事 此处
- id: g6-04
  hsk: '6'
  code: 六04
  title: 名量词：餐、串、滴、副、股、集、枝
  examples:
    - 一餐饭 一串葡萄 一滴水 一副球拍 一股力量 一集电视剧 一枝花
- id: g6-05
  hsk: '6'
  code: 六05
  title: 动量词：番、声、趟
  examples:
    - 讨论一番 说一声 跑两趟
- id: g6-06
  hsk: '6'
  code: 六06
  title: 程度副词：特、异常
  examples:
    - 他特高兴，因为他的设计获奖了。
    - 今天天气异常寒冷。
- id: g6-07
  hsk: '6'
  code: 六07
  title: 范围、协同副词：尽、净、一齐、一同
  examples:
    - 刚上班，分配给我的尽是些基础工作。
    - 这里净是垃圾，都没地方站。
    - 大家一齐动手，清理路上的垃圾。
    - 这是我们一同努力的结果。
- id: g6-08
  hsk: '6'
  code: 六08
  title: 时间副词：时时、一时、早晚
  examples:
    - 老师时时关注着我们的学习。
    - 我好像在哪儿见过他，可一时又想不起来了。
    - 他早晚会知道事情的真相。
- id: g6-09
  hsk: '6'
  code: 六09
  title: 关联副词：便
  examples:
    - 他一下课便回家了。
    - 他一毕业便决定回国。
- id: g6-10
  hsk: '6'
  code: 六10
  title: 方式副词：不禁、赶忙、亲眼、特地、特意
  examples:
    - 我不禁回忆起第一次跟她见面的场景。
    - 要迟到了，他赶忙出门，早饭都没吃。
    - 这件事是我亲眼所见，不会有假。
    - 我都准备好了，你不用特地跑来帮我。
    - 大卫今天第一天上班，特意穿了双新皮鞋。
- id: g6-11
  hsk: '6'
  code: 六11
  title: 情态副词：仿佛
  examples:
    - 奶奶仿佛孩子似的开心地笑了。
    - 他工作起来仿佛不知道什么是累。
- id: g6-12
  hsk: '6'
  code: 六12
  title: 语气副词：才、刚好、偏、恰好
  examples:
    - 我才不要父母的钱呢，我要自己赚钱。
    - 我要出门找他的时候他刚好回来了。
    - 北方的冬天极其寒冷，可他圣诞节偏要去那儿旅行。
    - 哥哥非常粗心，弟弟却恰好相反。
- id: g6-13
  hsk: '6'
  code: 六13
  title: 于
  examples:
    - 他出生于1995年。
    - 大熊猫主要生活于中国西南地区。
- id: g6-14
  hsk: '6'
  code: 六14
  title: 沿（着）
  examples:
    - 他喜欢沿着湖散步。
    - 你沿这条路走，一会儿就到了。
    - 我沿着他指的路，很快找到了他家。
- id: g6-15
  hsk: '6'
  code: 六15
  title: 同、与
  examples:
    - 同你一样，我也是学生。
    - 你要与同学搞好关系。
- id: g6-16
  hsk: '6'
  code: 六16
  title: 至于
  examples:
    - 旅行的时间已经定了，至于费用问题，还需要再讨论。
    - 学校决定下个月举行运动会，至于具体时间，请待学校通知。
    - 超市将于节日期间举行优惠活动，至于详细情况，可上网查查。
- id: g6-17
  hsk: '6'
  code: 六17
  title: 因
  examples:
    - 因公司的业务需要，她要去中国出差。
    - 昨天她因病请假。
    - 他因出门太晚迟到了。
- id: g6-18
  hsk: '6'
  code: 六18
  title: 除
  examples:
    - 除他以外，所有人都来了。
    - 除这件事以外，其他我都能答应你。
    - 除这个箱子以外，没有其他行李了。
- id: g6-19
  hsk: '6'
  code: 六19
  title: 据
  examples:
    - 据专家介绍，这个信息并不准确。
    - 据统计，大多数家庭有一到两个子女。
    - 据说，他还没决定放弃。
- id: g6-20
  hsk: '6'
  code: 六20
  title: 连接词或词组：而、同、与
  examples:
    - 她善良而乐观。
    - 我同他都是新员工。
    - 成与不成，都看你的啦！
- id: g6-21
  hsk: '6'
  code: 六21
  title: 连接分句或句子：不料、可、若
  examples:
    - 我今天本想去操场踢足球，不料外面下起雨来。
    - 我们约定一起去长城玩儿，可他忘记了。
    - 若这个时间你不方便，我们就换一个。
- id: g6-22
  hsk: '6'
  code: 六22
  title: 结构助词：所
  examples:
    - 据我所知，这件事不是真的。
    - 你所做的每件事我都支持。
    - 这部电影正是我所感兴趣的。
- id: g6-23
  hsk: '6'
  code: 六23
  title: 语气助词：罢了、啦、嘛
  examples:
    - 别生气，我只是开个玩笑罢了。
    - 我终于把这个问题搞明白啦！
    - 什么事，你快说嘛！
- id: g6-24
  hsk: '6'
  code: 六24
  title: 数词+形容词+量词
  examples:
    - 一大杯茶 一长串葡萄 一小份米饭
- id: g6-25
  hsk: '6'
  code: 六25
  title: 或A或B
  examples:
    - 每位市民都为这座城市的发展做出过或大或小的贡献。
    - 各个企业都有一套或高或低的质量监测管理标准。
- id: g6-26
  hsk: '6'
  code: 六26
  title: 无A无B
  examples:
    - 妈妈无时无刻不在想念着国外留学的孩子。
    - 这孩子再不管管就无法无天了。
- id: g6-27
  hsk: '6'
  code: 六27
  title: A这A那
  examples:
    - 他总是很耐心地听她说这说那。
    - 他这个人真是麻烦，总是嫌这嫌那的。
- id: g6-28
  hsk: '6'
  code: 六28
  title: 左A右B
  examples:
    - 他左躲右闪，终于把球踢进了球门。
    - 第一次出门，他兴奋得左瞧右看，眼睛都不够用了。
    - 他左思右想，觉得这件事不能这样就完了。
- id: g6-29
  hsk: '6'
  code: 六29
  title: 不怎么
  examples:
    - 这件衣服不怎么好看，换一件吧。
    - 他不怎么在乎这些小事。
    - 他今天好像不怎么舒服。
- id: g6-30
  hsk: '6'
  code: 六30
  title: 不怎么样
  examples:
    - 她跳舞跳得不怎么样。
    - 甲：这件衣服怎么样？
    - 乙：不怎么样。
- id: g6-31
  hsk: '6'
  code: 六31
  title: 好（不）容易
  examples:
    - 我好不容易给你争取来这个机会，你怎么能不抓住呢？
    - 你好容易走到这一步，怎么能说放弃就放弃呢？
    - 我好不容易说服他来参加比赛，你不能让他走。
- id: g6-32
  hsk: '6'
  code: 六32
  title: 那倒（也）是
  examples:
    - 现在看来，那倒是个很好的办法。
    - 实在没办法，那倒也是个办法。
    - 甲：如果能找到失败的原因，那倒是件值得高兴的事。
    - 乙：那倒也是。
- id: g6-33
  hsk: '6'
  code: 六33
  title: 就是说/这就是说
  examples:
    - 就是说，他是一个不诚实的人。
    - 这就是说，责任不在你，你千万不要怪自己。
- id: g6-34
  hsk: '6'
  code: 六34
  title: 算了
  examples:
    - 这件事就这样算了吧。
    - 他不去算了，不要为难他了。
    - 甲：不行，我得好好问问他。
    - 乙：算了，你说不过他的。
- id: g6-35
  hsk: '6'
  code: 六35
  title: A—+量词，B—+量词
  examples:
    - 他摔得很严重，身上青一块，紫一块。
    - 大家你一句，我一句，搞得他反而没了主意。
    - 他俩说着话，突然你一下儿、我一下儿地打起来了。
- id: g6-36
  hsk: '6'
  code: 六36
  title: 东一A，西一A
  examples:
    - 天黑还下雨，他东一脚，西一脚地赶回来了。
    - 他说话东一句，西一句，完全没有重点。
    - 他做事情总是东一下儿，西一下儿，既无计划更无耐心。
- id: g6-37
  hsk: '6'
  code: 六37
  title: 为了⋯⋯而⋯⋯
  examples:
    - 为了这么一件小事而生气，不值得。
    - 他为了这次比赛而努力了很久。
    - 这是为了讨论改善环境问题而召开的会议。
- id: g6-38
  hsk: '6'
  code: 六38
  title: 宾语的语义类型2
  examples:
    - （1）处所宾语
    - 听见铃声，他马上就进教室了。
    - 他把东西都放桌子上了。
    - （2）结果宾语
    - 在中国农村，盖房子是一件大事。
    - 新学期的学生太多了，学校正在校园里建食堂。
- id: g6-39
  hsk: '6'
  code: 六39
  title: 趋向补语5
  examples:
    - 表示状态意义（引申用法）：动词/形容词+下来/下去/起来/过来
    - 老师一进教室，同学们很快安静了下来。
    - 他对工作的兴趣渐渐淡了下去。
    - 我们先把礼物藏起来。
    - 经过医生的抢救，他终于醒过来了。
- id: g6-40
  hsk: '6'
  code: 六40
  title: “把”字句4：表致使
  examples:
    - （1）主语（非生物体）+把+宾语+动词+其他成分
    - 这双鞋把脚磨破了。
    - 外面的声音把我吵醒了。
    - （2）主语+把+宾语（施事）+动词+其他成分
    - 他把大伙儿笑得肚子疼。
    - 他把爸爸气得一夜没睡。
    - 孩子把妈妈感动得流下了眼泪。
- id: g6-41
  hsk: '6'
  code: 六41
  title: 被动句4：主语+被/叫/让+宾语+给+动词+其他成分
  examples:
    - 杯子被她不小心给摔碎了。
    - 自行车叫小偷儿给偷走了。
    - 这件事差点儿让我给忘了。
- id: g6-42
  hsk: '6'
  code: 六42
  title: 时而⋯⋯，时而⋯⋯
  examples:
    - 这儿的天气变来变去，时而晴天，时而下雨。
    - 生活就是这样，时而让人失望，时而让人充满信心。
    - 她的情绪很不稳定，时而积极，时而消极。
- id: g6-43
  hsk: '6'
  code: 六43
  title: 一时⋯⋯一时⋯⋯
  examples:
    - 年纪太大了，身体一时好一时坏。
    - 这家公司的产量一时上升一时下降。
    - 他的情绪有波动，一时高兴一时悲伤。
- id: g6-44
  hsk: '6'
  code: 六44
  title: ⋯⋯便⋯⋯
  examples:
    - 我一走出校门，抬头便看见了她。
    - 她放下电话，衣服没换便往医院赶。
    - 一回到家，他便看到了桌子上的饭菜。
- id: g6-45
  hsk: '6'
  code: 六45
  title: 不但不/不但没有⋯⋯，反而⋯⋯
  examples:
    - 他不但不帮我，反而还给我添麻烦。
    - 夏天过去了，天气不但没有凉快，反而更热了。
    - 他不但没有鼓励我，反而还批评了我一顿。
- id: g6-46
  hsk: '6'
  code: 六46
  title: 不是⋯⋯，还/还是⋯⋯
  examples:
    - 不是读完了就可以了，还应该写一篇作文。
    - 这事不是你想做就能做的，还是要听听老板的意见。
- id: g6-47
  hsk: '6'
  code: 六47
  title: 连⋯⋯也/都⋯⋯，⋯⋯更⋯⋯
  examples:
    - 连大人也做不到，孩子更做不到。
    - 连老人也喜欢看，孩子们更是喜欢得不得了。
- id: g6-48
  hsk: '6'
  code: 六48
  title: 要么⋯⋯，要么⋯⋯
  examples:
    - 你要么跟他一组，要么自己一个人一组，尽快决定吧。
    - 面对困难，我们要么被它吓倒，要么战胜它。
    - 教室里的同学们要么在写作业，要么在小声讨论。
- id: g6-49
  hsk: '6'
  code: 六49
  title: 虽⋯⋯，但/可/却/也⋯⋯
  examples:
    - 他年纪虽小，但经验不少。
    - 我虽没得到奖励，可仍然对自己充满信心。
    - 他虽失败了，却仍然微笑面对。
    - 她虽病了，也坚持来上课。
- id: g6-50
  hsk: '6'
  code: 六50
  title: ⋯⋯，要不然/不然⋯⋯
  examples:
    - 大家要认真对待考试，要不然会影响毕业的。
    - 你不用太担心，不然我和你一起去。
    - 外面下雨了，不然我们明天再去吧。
- id: g6-51
  hsk: '6'
  code: 六51
  title: 凡是⋯⋯，都⋯⋯
  examples:
    - 凡是听到高兴的事，他都和朋友分享。
    - 凡是跟他合作，都能顺利完成任务。
    - 凡是对的，我们都应该坚持。
- id: g6-52
  hsk: '6'
  code: 六52
  title: 就算/就是⋯⋯也⋯⋯
  examples:
    - 就算成绩最好的同学也无法回答这个问题。
    - 就是你想马上瘦下来也不能每天不吃饭。
    - 就算他错了你也不能说他，他还小呢。
- id: g6-53
  hsk: '6'
  code: 六53
  title: 不⋯⋯不⋯⋯
  examples:
    - 你们两个人可真是不打不成交。
    - 这里的房价不问不知道，一问吓一跳。
    - 她今天一直在练习，不达标准不休息。
- id: g6-54
  hsk: '6'
  code: 六54
  title: 二重复句2：复句+复句
  examples:
    - 成功的基础是奋斗，奋斗的收获是成功，所以，只有不断努力的人才有机会走上成功的高峰。
    - 这个国王既不关心他的军队，也不喜欢去看戏，也不喜欢乘着马车去游玩儿，————除非是要展示一下儿自己的新衣服。
    - 承认错误，才能正确看待出现在自己身上的问题；同时，只有虚心接受别人的批评，解决了自己的问题，才能取得下一步的成功。
- id: g6-55
  hsk: '6'
  code: 六55
  title: 用“非⋯⋯不可”表示强调
  examples:
    - 不管天气怎么样，我们非去不可。
    - 还有这么长准备时间呢，你非要现在写完不可吗？
    - 他正生着气呢，你非现在说不可吗？
- id: g6-56
  hsk: '6'
  code: 六56
  title: X到Y头上来了
  examples:
    - 他都欺负到你头上来了，你也不在乎吗？
    - 人家都求到我们头上来了，还是帮帮他们吧。
    - 这种好事怎么轮到我头上来了？
- id: g6-57
  hsk: '6'
  code: 六57
  title: X就X吧
  examples:
    - 等等就等等吧，没有别的办法了。
    - 少点儿就少点儿吧，总比没有强。
    - 晚点儿就晚点儿吧，来得及就行。
- id: g6-58
  hsk: '6'
  code: 六58
  title: X是X
  examples:
    - 去是去了，就是不知道结果怎么样。
    - 好是好，但不知道老师会不会同意我们这样做。
    - 这件衣服漂亮是漂亮，但也太贵了。
- id: g6-59
  hsk: '6'
  code: 六59
  title: 不X不⋯⋯，一X⋯⋯
  examples:
    - 不看不知道，一看吓一跳，这里变化太大了！
    - 这题目看起来简单，不做不知道，一做真不会！
- id: g6-60
  hsk: '6'
  code: 六60
  title: 好你个X
  examples:
    - 好你个小偷儿，敢偷我的东西，我送你去警察局！
    - 好你个大骗子，还好我聪明，没上你的当！
    - 好你个老王，一点儿忙都不帮我！
- id: g6-61
  hsk: '6'
  code: 六61
  title: 动词+什么（就）是什么
  examples:
    - 行啊！你说什么是什么，都听你的。
    - 哪有这么容易的，你想什么就是什么？
- id: g6-62
  hsk: '6'
  code: 六62
  title: 早（也）不X，晚（也）不X
  examples:
    - 早不来，晚不来，恰好要出门的时候他来了。
    - 早也不走，晚也不走，需要他的时候他却走了。
- id: g6-63
  hsk: '6'
  code: 六63
  title: 看/瞧把+宾语（施事）+X得
  examples:
    - 真是小孩子呀，看把他乐得。
    - 瞧把他得意得，都不知道自己是谁了。
    - 瞧把他吓得，都不知道说什么了。
- id: g6-64
  hsk: '6'
  code: 六64
  title: 放着X不Y
  examples:
    - 你可别放着好日子不过，在这儿找麻烦。
    - 他放着好好的学不上，非要跑去外面打工。
- id: g6-65
  hsk: '6'
  code: 六65
  title: X来X去，都是/就是⋯⋯
  examples:
    - 不管我们怎么争来争去，都是没有用的。
    - 说来说去，就是没有统一的意见。
- id: g6-66
  hsk: '6'
  code: 六66
  title: X了就X了，（没）有⋯⋯
  examples:
    - 坏了就坏了，有什么大不了的？
    - 输了就输了，没有什么好难过的。
- id: g6-67
  hsk: '6'
  code: 六67
  title: 这/那也不X，那/这也不Y
  examples:
    - 这也不吃，那也不喝，结果就是身体越来越差。
    - 那也不合适，这也不对，我真的不明白她到底想怎样。
- id: g79-001
  hsk: 7-9
  code: 七—九001
  title: 能愿动词：需
  examples:
    - 父亲的身体需休养一段时间。
    - 我们仍需耐心等待。
- id: g79-002
  hsk: 7-9
  code: 七—九002
  title: 疑问代词：何
  examples:
    - 我们何时出发？
    - 不管你有何疑问，都可以到办公室找我。
- id: g79-003
  hsk: 7-9
  code: 七—九003
  title: 指示代词：该、另、兹
  examples:
    - 该企业 另一回事 兹日
- id: g79-004
  hsk: 7-9
  code: 七—九004
  title: 名量词
  examples:
    - （1）栋、粒、枚、则、盏
    - 四栋楼 三粒药 五枚硬币 一则新闻 一盏灯
    - （2）复合量词：人次
    - 接待三千人次
- id: g79-005
  hsk: 7-9
  code: 七—九005
  title: 极为
  examples:
    - 齐白石是极为杰出的画家。
    - 能源汽车的发展前景极为广阔。
- id: g79-006
  hsk: 7-9
  code: 七—九006
  title: 尽
  examples:
    - 坐在尽前头的是我女朋友。
    - 尽北边有一个空位，您可以考虑这个位置。
- id: g79-007
  hsk: 7-9
  code: 七—九007
  title: 蛮
  examples:
    - 她的分数蛮高的，大学肯定能考上。
    - 昨天刚下完雪，今天蛮冷的。
- id: g79-008
  hsk: 7-9
  code: 七—九008
  title: 颇
  examples:
    - 我对这部电影的印象颇深。
    - 他对导游这份工作颇有兴趣。
- id: g79-009
  hsk: 7-9
  code: 七—九009
  title: 稍稍
  examples:
    - 听了他的话，我稍稍松了一口气。
    - 上海的夏天又闷又热，稍稍一动就会出汗。
- id: g79-010
  hsk: 7-9
  code: 七—九010
  title: 尤为
  examples:
    - 葡萄中的维生素含量尤为丰厚。
    - 他对自己的要求尤为严格。
- id: g79-011
  hsk: 7-9
  code: 七—九11
  title: 越发
  examples:
    - 听到这个消息，同学们越发有热情了。
    - 随着年龄的增长，他越发不喜欢出去旅行了。
- id: g79-012
  hsk: 7-9
  code: 七—九012
  title: 凡
  examples:
    - 凡事自己努力去做就好。
    - 凡年龄满十八岁的公民都有选举与被选举的权利。
- id: g79-013
  hsk: 7-9
  code: 七—九013
  title: 皆
  examples:
    - 这己是人人皆知的事实。
    - 这个比赛十六到十九岁的男性青少年皆可报名参加。
- id: g79-014
  hsk: 7-9
  code: 七—九014
  title: 统统
  examples:
    - 我们不得不承认这些材料统统没有价值。
    - 时间、地点、人物、事件，她统统不记得。
- id: g79-015
  hsk: 7-9
  code: 七—九015
  title: 唯独
  examples:
    - 全班同学都在认真听讲，唯独他在睡觉
    - 他什么都不在乎，唯独受不了家人的不理解
- id: g79-016
  hsk: 7-9
  code: 七—九016
  title: 即
  examples:
    - 对待教育问题，不宜忽视，要严肃对待，有错即改。
    - 西北人张口即来的这种民歌，是高原上一道美丽的风景。
- id: g79-017
  hsk: 7-9
  code: 七—九017
  title: 历来
  examples:
    - 王老师历来重视培养学生的动手能力。
    - 流行歌曲历来是社会文化不可以缺少的一部分。
- id: g79-018
  hsk: 7-9
  code: 七—九018
  title: 尚
  examples:
    - 这个调查到现在为止尚无进展。
    - 这个问题想研究明白，尚需努力。
- id: g79-019
  hsk: 7-9
  code: 七—九019
  title: 向来
  examples:
    - 他这个人向来吃软不吃硬，你不能硬来。
    - 他向来第一个到学校，从未迟到过。
- id: g79-020
  hsk: 7-9
  code: 七—九020
  title: 频频
  examples:
    - 他频频与朋友们以及他的竞争者们打招呼。
    - 气氛十分热烈，大家频频举杯，说笑不停，非常高兴。
- id: g79-021
  hsk: 7-9
  code: 七—九021
  title: 再度
  examples:
    - 这个班再度被评为“优秀班集体”。
    - 两位好友二十年后再度相遇。
- id: g79-022
  hsk: 7-9
  code: 七—九022
  title: 亦
  examples:
    - 此人并不存在，将来亦不会出现，永远不会。
    - 若能从失败中获得教训，失败亦是成功。
- id: g79-023
  hsk: 7-9
  code: 七—九023
  title: 未
  examples:
    - 他至今还未和我联系。
    - 虽然他四十未到，但已经是很成熟的经理了。
- id: g79-024
  hsk: 7-9
  code: 七—九024
  title: 勿
  examples:
    - 希望各位勿忘十年后的约定。
    - 我在国外一切都很好，勿念。
- id: g79-025
  hsk: 7-9
  code: 七—九025
  title: 不由得
  examples:
    - 看着父亲粗糙的手，我不由得流下了眼泪。
    - 看着毕业照，我不由得开始回忆起往事。
- id: g79-026
  hsk: 7-9
  code: 七—九026
  title: 顺便
  examples:
    - 去老师办公室的时候，他顺便把我的作业也交了。
    - 我到了上海，顺便去看望了小学老师。
- id: g79-027
  hsk: 7-9
  code: 七—九027
  title: 一连
  examples:
    - 这场大雨一连下了十多天，也就把工人们困在这里十多天。
    - 他上了床，在一连三天三夜没睡好以后终于能舒舒服服地睡上一觉了。
- id: g79-028
  hsk: 7-9
  code: 七—九028
  title: 按说
  examples:
    - 按说现在是蔬菜供应淡季，可是这里的蔬菜种类还是不少。
    - 按说这个时候应该下雪了，可今年一场雪还没下。
- id: g79-029
  hsk: 7-9
  code: 七—九029
  title: 必定
  examples:
    - 若是有个太太照顾着他，他的生活必定不会那么乱七八糟了。
    - 倘若他们想要人为地挽救这一文明，必定会失败。
- id: g79-030
  hsk: 7-9
  code: 七—九030
  title: 不妨
  examples:
    - 据说这个药效果很好，你不妨试一试。
    - 关于这个问题，咱们不妨听一听别人的建议。
- id: g79-031
  hsk: 7-9
  code: 七—九031
  title: 何必
  examples:
    - 我只是和你开玩笑，何必当真呢？
    - 咱们是老同学，何必这么客气。
- id: g79-032
  hsk: 7-9
  code: 七—九032
  title: 莫非
  examples:
    - 她今天没来学校，莫非出了什么事？
    - 你平时不认真学习，莫非要等到期末考试了才开始紧张吗？
- id: g79-033
  hsk: 7-9
  code: 七—九033
  title: 白白
  examples:
    - 她忘了关水龙头，白白浪费了很多水。
    - 这次投资失败了，让公司白白损失了很多钱。
- id: g79-034
  hsk: 7-9
  code: 七—九034
  title: 反倒
  examples:
    - 明明是你的错，怎么反倒怪我了？
    - 他越是在困难的时候反倒越能坚持。
- id: g79-035
  hsk: 7-9
  code: 七—九035
  title: 分明
  examples:
    - 我分明看他走过来了，怎么一下子就不见了呢？
    - 让我三天就完成，你分明是在为难我。
- id: g79-036
  hsk: 7-9
  code: 七—九036
  title: 怪不得
  examples:
    - 怪不得她没去爬山，原来昨天下雨了。
    - 这姑娘漂亮，人品也好，怪不得有很多男孩儿喜欢她。
- id: g79-037
  hsk: 7-9
  code: 七—九037
  title: 好在
  examples:
    - 好在你现在也在北京，你们可以互相照顾。
    - 好在他病得不重，应该马上就能上班了。
- id: g79-038
  hsk: 7-9
  code: 七—九038
  title: 乃
  examples:
    - 《红楼梦》乃古代小说的杰出代表。
    - 失败乃成功之母。
- id: g79-039
  hsk: 7-9
  code: 七—九039
  title: 难怪
  examples:
    - 这道题非常难，难怪她一时答不出来。
    - 他是个东北人，难怪他不怕冷。
- id: g79-040
  hsk: 7-9
  code: 七—九040
  title: 偏偏
  examples:
    - 周围这么多漂亮的女生，你怎么偏偏喜欢她？
    - 我们已经穿好衣服准备要走了，可孩子偏偏又醒了。
- id: g79-041
  hsk: 7-9
  code: 七—九041
  title: 索性
  examples:
    - 衣服已经被雨淋湿了，我索性就合上了伞，直接在雨中散步了。
    - 现在已经很晚了，我索性直接在外面吃完饭再回家好了。
- id: g79-042
  hsk: 7-9
  code: 七—九042
  title: 万万
  examples:
    - 万万不能开着煤气出门。
    - 触犯法律的事情是万万干不得的。
- id: g79-043
  hsk: 7-9
  code: 七—九043
  title: 未免
  examples:
    - 这道题未免也太难了吧。
    - 你这样说她，未免也太过分了。
- id: g79-044
  hsk: 7-9
  code: 七—九044
  title: 无非
  examples:
    - 他这么做，无非是为了早点儿回家。
    - 她想要的无非是一份稳定的工作。
- id: g79-045
  hsk: 7-9
  code: 七—九045
  title: 幸好
  examples:
    - 他来的时候，幸好我在家，不然他又该生气了。
    - 幸好你提醒了我，要不我就忘了。
- id: g79-046
  hsk: 7-9
  code: 七—九046
  title: 幸亏
  examples:
    - 幸亏你回来得早，不然我就不知道怎么办才好了。
    - 我们幸亏走了这条路，才没碰到堵车。
- id: g79-047
  hsk: 7-9
  code: 七—九047
  title: 终究
  examples:
    - 他终究是个孩子，你得耐心一点儿。
    - 你们对工作这么不负责任，终究会出问题的。
- id: g79-048
  hsk: 7-9
  code: 七—九048
  title: 顺着
  examples:
    - 雨水顺着我的头发滴了下来。
    - 我们就顺着这条路走，走到哪儿算哪儿。
- id: g79-049
  hsk: 7-9
  code: 七—九049
  title: 当着
  examples:
    - 当着我的面，你有什么想说的就都说出来吧。
    - 我当着大家的面把礼物拆开了。
- id: g79-050
  hsk: 7-9
  code: 七—九050
  title: 就5
  examples:
    - 他已就这个问题做了检讨。
    - 我想就如何找到自己满意的工作这个问题来谈一谈。
- id: g79-051
  hsk: 7-9
  code: 七—九051
  title: 趁
  examples:
    - 趁你还年轻，一定要多尝试。
    - 趁火车还没开，你现在还能下车。
- id: g79-052
  hsk: 7-9
  code: 七—九052
  title: 基于
  examples:
    - 这两种不同的人生态度是基于对人生不同的理解。
    - 你的结论都基于假设，所以不可信。
- id: g79-053
  hsk: 7-9
  code: 七—九053
  title: 依
  examples:
    - 依你看，这件事该怎么解决？
    - 这件事就依你的方案做吧。
- id: g79-054
  hsk: 7-9
  code: 七—九054
  title: 连接词或词组：及
  examples:
    - 工人、农民及士兵都参加了此次会议。
    - 现急需煤炭、石油、电力及其他能源。
- id: g79-055
  hsk: 7-9
  code: 七—九055
  title: 连接分句或句子：继而、要不是
  examples:
    - 他本来不同意的，可继而一想，又觉得是一个好机会。
    - 人民币升值将会影响到中国的出口，继而影响中国的经济增长。
    - 要不是老师帮我，我也不能写好这篇文章。
- id: g79-056
  hsk: 7-9
  code: 七—九056
  title: 之
  examples:
    - 我们可以将北京描绘为一本梦之书。
    - 由于做了好事，做出了贡献，因此他得到所爱之人的欣赏。
- id: g79-057
  hsk: 7-9
  code: 七—九057
  title: 而已
  examples:
    - 这算什么，只是一堆纸而已。
    - 我不过是出于好奇，随便问问而已。
- id: g79-058
  hsk: 7-9
  code: 七—九058
  title: 矣
  examples:
    - 人生得一知己足矣。
    - 他的想法可谓多矣。
- id: g79-059
  hsk: 7-9
  code: 七—九059
  title: 数词+量词+抽象事物
  examples:
    - 他有一身本领，颇有才华。
    - 这里虽然听不见什么争吵声，但并不是一团和气。
- id: g79-060
  hsk: 7-9
  code: 七—九060
  title: 爱A不A
  examples:
    - 他瞧不起她，对她总是一副爱理不理的样子。
    - 这是我的想法，你爱听不听。
- id: g79-061
  hsk: 7-9
  code: 七—九061
  title: 半A半B
  examples:
    - 他说话半真半假，你不要完全相信他。
    - 突然听到明天放假的消息，我一直半信半疑。
- id: g79-062
  hsk: 7-9
  code: 七—九062
  title: 东A西B
  examples:
    - 她买东西就喜欢东挑西选。
    - 为了买到一张火车票，我东奔西跑，累得一身汗。
- id: g79-063
  hsk: 7-9
  code: 七—九063
  title: 非A非B
  examples:
    - 这场悲剧的制造者非你非我，另有他人。
    - 我们非敌非友，只是那天见过一面而已。
- id: g79-064
  hsk: 7-9
  code: 七—九064
  title: 忽A忽B
  examples:
    - 叔叔书房的门关着，里边的说话声忽高忽低。
    - 他十分紧张，心跳得忽快忽慢。
- id: g79-065
  hsk: 7-9
  code: 七—九065
  title: 连A带B
  examples:
    - 几个小孩儿吓得连哭带叫。
    - 信是男朋友写的，她高兴得连蹦带跳。
- id: g79-066
  hsk: 7-9
  code: 七—九066
  title: 时A时B
  examples:
    - 小鸟发出的声音时长时短。
    - 他的成绩时好时坏，老师也拿他没办法。
- id: g79-067
  hsk: 7-9
  code: 七—九067
  title: 自A自B
  examples:
    - 一路上老板自说自话唠叨了半天。
    - 想到你对我们工作的破坏，我应该让你自作自受才对。
- id: g79-068
  hsk: 7-9
  code: 七—九068
  title: 巴不得
  examples:
    - 他一口气跑了半个多小时，巴不得一步就到家。
    - 我恨这个行业，巴不得早点儿离开。
- id: g79-069
  hsk: 7-9
  code: 七—九069
  title: 别提了
  examples:
    - 晚饭还没开始吃他就已经醉了，后来就更别提了。
    - 别提了.我根本都不认识那个人，他硬拉着我不让我走。
- id: g79-070
  hsk: 7-9
  code: 七—九070
  title: 除此之外
  examples:
    - 他是个老师，除此之外，我不知道别的。
    - 我只带了一个书包，除此之外什么都没带。
- id: g79-071
  hsk: 7-9
  code: 七—九071
  title: 归根到底
  examples:
    - 人生归根到底是一个人的旅行。
    - 归根到底，成长是一种幸福。
- id: g79-072
  hsk: 7-9
  code: 七—九072
  title: 可不是
  examples:
    - 甲：什么？我们家出事了？
    - 乙：可不是，警察都已经来了。
    - 甲：小孩子长得真快啊！
    - 乙：可不是，已经要上小学了。
- id: g79-073
  hsk: 7-9
  code: 七—九073
  title: 没说的
  examples:
    - 我愿意做这件事，那是没说的，只是我不知道还能做多长时间。
    - 新来的领导我都见过了，真是没说的！
- id: g79-074
  hsk: 7-9
  code: 七—九074
  title: 无论如何
  examples:
    - 无论如何，他没有别的选择。
    - 听到这里，他无论如何也不答应。
- id: g79-075
  hsk: 7-9
  code: 七—九075
  title: 由此可见
  examples:
    - 很多中国孩子从小学习书法，由此可见书法在中国教育中的重要地位。
    - 他幻想着将来住在爷爷家里以后要干些什么事，一遍遍说个没完，由此可见，他对母亲并没有什么舍不得。
- id: g79-076
  hsk: 7-9
  code: 七—九076
  title: 与此同时
  examples:
    - 太阳落山了，几乎与此同时下起了大雨。
    - 几个月之后，他的眼睛开始不停地流眼泪，与此同时他的视力也变得越来越差。
- id: g79-077
  hsk: 7-9
  code: 七—九077
  title: 这样一来
  examples:
    - 这些小鸟总是在唱歌，这样一来，我家门前可热闹了。
    - 他听了医生的话，每天都去外面散步，这样一来，他的病很快就好了。
- id: g79-078
  hsk: 7-9
  code: 七—九078
  title: 综上所述
  examples:
    - 综上所述，如果希望交流顺利地进行，需要大家共同努力
    - 综上所述，随着科技的发展，人们越来越依赖手机。
- id: g79-079
  hsk: 7-9
  code: 七—九079
  title: 总的来说/总而言之
  examples:
    - 总的来说，他的身体状态还算不错。
    - 她的专业能力很不错，工作态度总的来说也很端正，是个很好的合作伙伴。
    - 总而言之，最重要的应该是过程，而不是结果。
    - 总而言之一句话，我不喜欢他。
- id: g79-080
  hsk: 7-9
  code: 七—九080
  title: 不知⋯⋯好
  examples:
    - 这件事很复杂，不知如何解决才好。
    - 看他紧张得手心都是汗，我也不知说什么好。
- id: g79-081
  hsk: 7-9
  code: 七—九081
  title: 所谓⋯⋯ 就是⋯⋯
  examples:
    - 房内没有一样值钱的东西，所谓家具就是这几把椅子。
    - 他所谓的好家庭就是住在一栋大房子里，妻子穿着漂亮的衣服。
- id: g79-082
  hsk: 7-9
  code: 七—九082
  title: 无非/不过/只不过/只是⋯⋯ 而已/罢了
  examples:
    - 不要相信他，这无非是他的借口罢了。
    - 我这么说没有其他意思，不过是想鼓励他而已。
    - 她会做这道题，只不过假装不会而已。
    - 大家都说爱情很快就会过去，剩下的只是习惯罢了。
- id: g79-083
  hsk: 7-9
  code: 七—九083
  title: 以⋯⋯ 为⋯⋯
  examples:
    - 我们不能以自己为中心，要考虑别人的感受。
    - 她以和平为主题，创作了一部小说。
- id: g79-084
  hsk: 7-9
  code: 七—九084
  title: 因⋯⋯ 而⋯⋯
  examples:
    - 我经常看到他因一件小事而快乐的场景。
    - 她胆子很大，不会因一些奇怪的声音而害怕。
- id: g79-085
  hsk: 7-9
  code: 七—九085
  title: 宾语的语义类型3
  examples:
    - （1）方式宾语
    - 为了方便取出来，他把钱存了个活期。
    - 为了节省时间，这封信还是寄航空吧。
    - （2）工具宾语
    - 他坚持每天写毛笔。
    - 他吃大碗，我吃小碗。
    - （3）材料宾语
    - 新手养菊花，该如何浇水？
    - 他在脸上盖一张报纸睡着了。
    - （4）目的宾语
    - 为了拍这部电影，他到处去拉赞助。
    - 他在我们公司主要跑项目。
- id: g79-086
  hsk: 7-9
  code: 七—九086
  title: 程度补语3
  examples:
    - （1）形容词/动词+得+不行
    - 终于要去旅游了，儿子兴奋得不行。
    - 上学时我对体育课也是讨厌得不行。
    - （2）形容词/动词+得+要命/要死
    - 他人不大，但是脾气大得要命。
    - 我最近太忙了，每天累得要死。
- id: g79-087
  hsk: 7-9
  code: 七—九087
  title: 状态补语3：“个”引导的补语
  examples:
    - 那个小女孩儿哭个不停，说是找不到妈妈了。
    - 他在我们面前说个没完。
- id: g79-088
  hsk: 7-9
  code: 七—九088
  title: “把”字句5：表致使
  examples:
    - （1）（主语+）把+宾语（施事）+动词+了
    - 去年她把丈夫死了，后来父母也去世了。
    - 钱没挣着，却把老公跑了。
- id: g79-089
  hsk: 7-9
  code: 七—九089
  title: 被动句5
  examples:
    - （1）被⋯⋯所⋯⋯
    - 这是我第一次感到自己被一个人所吸引。
    - 没想到，他竟然会被一个小学生所欺骗。
    - （2）为⋯⋯所⋯⋯
    - 他这种行为，为人类社会所不容。
    - 领导的这种行为往往不为人所信任。
- id: g79-090
  hsk: 7-9
  code: 七—九090
  title: 比较句6
  examples:
    - （1）比起⋯⋯（来）
    - 比起其他人.我的想法太简单了。
    - 比起唱歌来，他更喜欢跳舞。
    - （2）A+形容词+于+B
    - 人的自我实现过程重于结果。
    - 在施工现场，工人们的安全高于一切，大于一切。
    - （3）A+比+名词+还+名词
    - 他简直比强盗还强盗！
    - 在上流社会里，他装得比绅士还绅士。
- id: g79-091
  hsk: 7-9
  code: 七—九091
  title: 一面⋯⋯ ，一面⋯⋯
  examples:
    - 他一面听老师讲课，一面认真记笔记。
    - 他一面做作业，一面看电视，做事一点儿都不用心。
- id: g79-092
  hsk: 7-9
  code: 七—九092
  title: ⋯⋯ ，此后⋯⋯
  examples:
    - 我们三年前见过一面，此后再也没有见过。
    - 她二十岁结了婚，此后丈夫生病，她照顾了四年。
- id: g79-093
  hsk: 7-9
  code: 七—九093
  title: 起初⋯⋯ ，⋯⋯ 才⋯⋯
  examples:
    - 他起初没明白，后来才理解了游戏的规则。
    - 我们起初不想参加的，只是不好意思拒绝，才去了那里。
- id: g79-094
  hsk: 7-9
  code: 七—九094
  title: 别说⋯⋯，连⋯⋯ 也/都⋯⋯; 连⋯⋯ 也/都⋯⋯ ，别说⋯⋯; 别说⋯⋯ ，即使⋯⋯即使⋯⋯ 也⋯⋯ ，别说⋯⋯
  examples:
    - 别说是大学生了，连小学生都比他写得好。
    - 我现在穷得连饭也吃不起了，别说买新衣服了。
    - 别说爸爸，即使是老师，也说不出这种植物的名字。
    - 即使是稍微有钱的家庭，也禁不住她这么花钱，别说普通家庭了。
- id: g79-095
  hsk: 7-9
  code: 七—九095
  title: ⋯⋯，何况⋯⋯
  examples:
    - 我不道歉，何况根本不是我的错！
    - 这道菜做起来很花时间的，何况今天顾客那么多。
- id: g79-096
  hsk: 7-9
  code: 七—九096
  title: ⋯⋯，进而⋯⋯
  examples:
    - 只有在这样的国家里，教师才能充分发展，进而保护他自己和公共利益。
    - 遇到困难不要回避，挺起身来向它挑战，进而战胜它。
- id: g79-097
  hsk: 7-9
  code: 七—九097
  title: ⋯⋯，况且
  examples:
    - 北京这么大，况且你又是第一次来，怎么能一下子就找到我家呢？
    - 那时天已经黑了，况且人又坐在车上，肯定看不清楚。
- id: g79-098
  hsk: 7-9
  code: 七—九098
  title: 连⋯⋯，更不用说⋯⋯
  examples:
    - 连他都不会，更不用说我了。
    - 我连上次的考试都没通过，更不用说这次的了。
    - 他连这几个字都不会写，更不用说写篇作文了。
- id: g79-099
  hsk: 7-9
  code: 七—九099
  title: ⋯⋯ ，乃至⋯⋯
  examples:
    - 他的脸色、眼神，乃至一举一动，都被别人看得清清楚楚。
    - 他熟悉北京，也熟悉巴黎，乃至全世界。
- id: g79-100
  hsk: 7-9
  code: 七—九100
  title: ⋯⋯ ，且⋯⋯
  examples:
    - 他办事严谨而认真，且十分负责，获得了领导的信任。
    - 这一条街又脏又乱，总是很潮湿，且一年四季总不免有种古怪气味。
- id: g79-101
  hsk: 7-9
  code: 七—九101
  title: ⋯⋯ ，甚至于⋯⋯
  examples:
    - 她不能忍受这种想法，甚至于一秒钟也受不了。
    - 这个小姑娘始终都是那副模样，甚至于一点儿也没长高。
- id: g79-102
  hsk: 7-9
  code: 七—九102
  title: 或⋯⋯ ，或⋯⋯
  examples:
    - 他把信藏在某个秘密的地方了，或一块石头下面，或一棵树后面。
    - 阿姨每次来我家都带着一群朋友，或二三人，或三四人，大家说说笑笑。
- id: g79-103
  hsk: 7-9
  code: 七—九103
  title: 宁可/宁愿⋯⋯ ，
  examples:
    - 他宁可饿着肚子去上课，也不愿意吃垃圾食品。
    - 他宁愿自己承担，也不肯把责任推给别人。
- id: g79-104
  hsk: 7-9
  code: 七—九104
  title: 与其⋯⋯ ，不如⋯⋯
  examples:
    - 与其去爬山，述不如在家看电视。
    - 与其在这里浪费时间，我们不如认真复习。
- id: g79-105
  hsk: 7-9
  code: 七—九105
  title: 与其⋯⋯ ，宁可/宁愿⋯⋯
  examples:
    - 与其在这里洗半天的衣服，我宁可去买新的。
    - 与其跟他一组，我宁愿一个人做这个项目。
- id: g79-106
  hsk: 7-9
  code: 七—九106
  title: ⋯⋯，而 ⋯⋯（则）⋯⋯
  examples:
    - 绝大多数的人用感觉来思考，而我却用思考来感觉。
    - 北方人过春节往往吃饺子，而南方人的习俗则是吃汤圆。
- id: g79-107
  hsk: 7-9
  code: 七—九107
  title: ⋯⋯，⋯⋯倒/反倒⋯⋯
  examples:
    - 我好心劝他，他倒怪我，真是好笑！
    - 听护士这么一说，他反倒放松了下来。
- id: g79-108
  hsk: 7-9
  code: 七—九108
  title: 倘若/若⋯⋯，⋯⋯
  examples:
    - 倘若这几个问题你都能解决，你一定会获得成功。
    - 若不小心，是不是又会发生纠纷？
- id: g79-109
  hsk: 7-9
  code: 七—九109
  title: 倘若/假设/假使/若⋯⋯ ，就/那（么）⋯⋯
  examples:
    - 倘若一点儿音乐知识都没有，就会遇到困难。
    - 假设这是我们未来的家园，那这个世界就不会再有饥饿的儿童。
    - 假使一切能重新开始，那么我绝不会选择这一条路。
- id: g79-110
  hsk: 7-9
  code: 七—九110
  title: 幸亏⋯⋯ ，要不然/不然/要不/否则⋯⋯
  examples:
    - 幸亏你提醒了我，要不然我就忘了。
    - 幸亏有你帮忙，不然我真不知道怎么办才好。
- id: g79-111
  hsk: 7-9
  code: 七—九111
  title: 别管⋯⋯ ，都⋯⋯
  examples:
    - 别管台下坐的是谁，你都要充满信心。
    - 这样的话一出口，别管是淮，都得挨骂。
- id: g79-112
  hsk: 7-9
  code: 七—九112
  title: 任⋯⋯ ，也⋯⋯
  examples:
    - 任他们怎么推，也推不动。
    - 任他是什么高职位的人，也管不了我。
- id: g79-113
  hsk: 7-9
  code: 七—九113
  title: （因）⋯⋯ ，故⋯⋯
  examples:
    - 因不是体面的事情，故不敢说出来。
    - 他已经适应了国外的生活，故不打算再回国。
- id: g79-114
  hsk: 7-9
  code: 七—九114
  title: 鉴于⋯⋯ ，⋯⋯
  examples:
    - 鉴于他的表现良好，学校决定允许他回来上课。
    - 鉴于他在处理这种问题上毫无经验，公司决定派我来帮助他。
- id: g79-115
  hsk: 7-9
  code: 七—九115
  title: （由于）⋯⋯ ，以致⋯⋯
  examples:
    - 他睡过头了，以致错过了第一节课。
    - 他由于学习不认真，以致考了最后一名。
- id: g79-116
  hsk: 7-9
  code: 七—九116
  title: ⋯⋯，以至于⋯⋯
  examples:
    - 事情发展得太快，以至于大家都难以反应。
    - 这篇课文他读了很多遍，以至于全文都背得出来。
- id: g79-117
  hsk: 7-9
  code: 七—九117
  title: 之所以⋯⋯，是因为/是由于⋯⋯
  examples:
    - 这部电影之所以好看，是因为内容很有趣。
    - 妈妈之所以生气了，是由于他不肯承认自己的错误。
- id: g79-118
  hsk: 7-9
  code: 七—九118
  title: 固然⋯⋯ ，也⋯⋯
  examples:
    - 那固然是我们的习惯，也还需要有另外的理由。
    - 他的话固然给我安慰，也使我难过。
- id: g79-119
  hsk: 7-9
  code: 七—九119
  title: ⋯⋯ 固然⋯⋯ ，但是/可是/不过⋯⋯
  examples:
    - 一个人的成功，聪明固然重要，但是努力更重要。
    - 网络固然给我们带来了便利，可是也给我们带来了麻烦。
    - 这种方法固然有用，不过也不能解决根本问题。
- id: g79-120
  hsk: 7-9
  code: 七—九120
  title: 即便⋯⋯ ，也⋯⋯
  examples:
    - 即便你成绩好，也不能骄傲。
    - 他眼神中充满的即便不是感动，至少也是同情。
- id: g79-121
  hsk: 7-9
  code: 七—九121
  title: 虽说⋯⋯ ，但是/可是/不过⋯⋯
  examples:
    - 虽说他年纪小，但是也不能过于任性。
    - 虽说中文很难，可是它很有趣。
    - 虽说这是件小事，不过我们应该重视起来。
- id: g79-122
  hsk: 7-9
  code: 七—九122
  title: 纵然⋯⋯ ，也⋯⋯
  examples:
    - 我们的意见纵然不一致，也应当互相理解。
    - 这事纵然不好，也是他们之间的事，就让他们自己处理吧。
- id: g79-123
  hsk: 7-9
  code: 七—九123
  title: ⋯⋯， 以⋯⋯
  examples:
    - 政府用他们的名字命名这条街，以纪念在战争中牺牲的战士。
    - 老师采用新的教学方法上课，以调动学生的积极性。
- id: g79-124
  hsk: 7-9
  code: 七—九124
  title: ⋯⋯，以免/免得⋯⋯
  examples:
    - 出门在外看好你的东西，以免丢失。
    - 你把这个写下来，免得过后忘记。
- id: g79-125
  hsk: 7-9
  code: 七—九125
  title: ⋯⋯，也就是说⋯⋯
  examples:
    - 这是我的决定，也就是说不关你的事。
    - 他说这是他新买的书，也就是说他不想借给我们看。
- id: g79-126
  hsk: 7-9
  code: 七—九126
  title: （要+）动词+就+动词+个+补语
  examples:
    - 要玩儿就玩儿个痛快，别总想工作。
    - 喝就喝个够，今天不醉不回家。
- id: g79-127
  hsk: 7-9
  code: 七—九127
  title: 动词（+宾语1）+就+动词（+宾语1 ），别⋯⋯
  examples:
    - 走就走，别用这个威胁我！
    - 说几句就说几句，别太在意。
- id: g79-128
  hsk: 7-9
  code: 七—九128
  title: 三重或三重以上的复句
  examples:
    - 他对中文感兴趣，而且对中国文化也十分好奇，所以决定去中国留学，但遭到了父母的反对。
    - 大家不要只看外面的风景，也不要只顾看手机，要看好自己的物品，以免产生不必要的损失。
    - 只要多练习，你的中文水平就会有进步，成绩也会提高，自然也会得到奖学金。
- id: g79-129
  hsk: 7-9
  code: 七—九129
  title: 反问句3：何必/何苦⋯⋯ 呢？
  examples:
    - 这么简单的事我又何必一件事分两次做呢？
    - 我对谁都没有讲，何苦事先就让他们伤心呢？
- id: g79-130
  hsk: 7-9
  code: 七—九130
  title: （不过/但/可是 话又说回来，⋯⋯
  examples:
    - 话又说回来，不能因为生病就失去希望。
    - 但话又说回来，我们为什么不能把事情处理得对我们更有利呢？
- id: g79-131
  hsk: 7-9
  code: 七—九131
  title: X（也）不是，不X也不是
  examples:
    - 走不是，不走也不是，弄得我们不知道怎么办才好。
    - 笑也不是，不笑也不是，真让人尴尬。
- id: g79-132
  hsk: 7-9
  code: 七—九132
  title: X也好/也罢，Y也好/也罢
  examples:
    - 去也好，不去也好，反正不是什么大不了的事。
    - 快乐也好，伤心也好，这个故事就要结束了。
    - 你也罢，我也罢，都帮不了什么忙。
    - 喜欢也罢，愤怒也罢，终究都是一种情绪。
- id: g79-133
  hsk: 7-9
  code: 七—九133
  title: X了又Y， Y了又X
  examples:
    - 他装了又拆，拆了又装，修理了一整天。
    - 小朋友写了又擦，擦了又写，正在认真地练习写汉字。
- id: g79-134
  hsk: 7-9
  code: 七—九134
  title: X也X不⋯⋯，Y也Y不⋯⋯
  examples:
    - 妈妈还处于担心的状态中，吃也吃不下，睡也睡不着。
    - 父母与孩子的关系就是这样，赶也赶不走，留也留不住。
- id: g79-135
  hsk: 7-9
  code: 七—九135
  title: 别提（有）多X了
  examples:
    - 刚才买的那件衣服，别提多好看了。
    - 听到爸爸的声音，她别提有多兴奋了。
- id: g79-136
  hsk: 7-9
  code: 七—九136
  title: 不知X的
  examples:
    - 不知怎么的，我的眼泪止不住地往下流。
    - 不知谁说的，他才是凶手。
- id: g79-137
  hsk: 7-9
  code: 七—九137
  title: 话（说）是这么说，不过/可/可是⋯⋯
  examples:
    - 话是这么说，不过她还是不习惯。
    - 说是这么说，可对方要是真这么干，那我们也做不了什么。
- id: g79-138
  hsk: 7-9
  code: 七—九138
  title: 看/瞧你那（X）样
  examples:
    - 看你那伤心样，还以为你这回真的好不到哪里去了。
    - 瞧你那样，还挺得意。
- id: g79-139
  hsk: 7-9
  code: 七—九139
  title: 看在X的面子上
  examples:
    - 我是看在她的面子上才答应的。
    - 三位客人看在老人的面子上又坐下了。
- id: g79-140
  hsk: 7-9
  code: 七—九140
  title: 哪有X这么Y的/有X这样Y的吗
  examples:
    - 哪有你这么过分的？好处全让你给占了。
    - 哪有你这么直接的？给他留点儿面子呀。
    - 有他这样做人的吗？总是在背后说人家坏话。
- id: g79-141
  hsk: 7-9
  code: 七—九141
  title: 什么X的Y的
  examples:
    - 什么你的我的，都是大家的。
    - 什么好的坏的，我们买的都是一样的。
- id: g79-142
  hsk: 7-9
  code: 七—九142
  title: 说到/想到哪儿去了
  examples:
    - 你看你，说到哪儿去了，我说的是买蛋糕的问题。
    - 你想到哪儿去了！我肯定不会跟别人说的。
- id: g79-143
  hsk: 7-9
  code: 七—九143
  title: 无所谓X不X
  examples:
    - 无所谓好看不好看，我满意就行。
    - 无所谓贵不贵，质量好就可以。
- id: g79-144
  hsk: 7-9
  code: 七—九144
  title: 要X有/没X，要Y有/没Y
  examples:
    - 她要成绩有成绩，要形象有形象。
    - 他要学历没学历，要胆子没胆子。
- id: g79-145
  hsk: 7-9
  code: 七—九145
  title: 带关联词语
  examples:
    - 除了记忆能力差之外，我还有其他的缺点，这些缺点在很大程度上使我变得无知。
    - 因为我脑子慢、糊涂，周围环境稍有变化就会看不清楚。因此，即使是十分容易解开的谜，我也从不要求自己去解。
    - 您花上几天时间，到处寻找，也可能没有一点儿收获。假如一个上午能找到两三片化石，那么这个上午就可以说是终生难忘的时刻了。然而，上个月我们竟然有过三次“终生难忘的时刻”。
- id: g79-146
  hsk: 7-9
  code: 七—九146
  title: 不带关联词语
  examples:
    - 风，更猛了。雪，更大了。我们每前进一步，更艰难了。
    - 盼望着，东风来了，春天的脚步近了。一切事物都像刚出生的孩子，柔柔的，嫩嫩的。草绿了，花开了，河面上的冰雪也开始融化了。
- id: g79-147
  hsk: 7-9
  code: 七—九147
  title: 联合关系：并列句群、承接句群、递进句群、选择句群、解说句群、总括句群
  examples:
    - 在一起一年多了。时间虽然不长，但是哥哥再也没有胃疼得起不来了，那是因为我每天早上硬拉他起来吃早饭。我呢，更是体会到了被人悉心照料的感觉。从此我们的生活就多了一份彼此间的牵挂。（承接句群）
    - 运动场聚集了很多人。来长跑的有大学的音乐系教授、中文系教授，有跳高运动员、跳远运动员、游泳运动员、长跑运动员，有那个写了一部小说的作家，还有各个大学的大学生。总而言之吧，那时候小小的农场真可谓人才聚集，全省的本事人基本上都到这里来了。（总括句群）
- id: g79-148
  hsk: 7-9
  code: 七—九148
  title: 偏正关系：条件句群、因果句群、目的句群、转折句群、假设句群、让步句群
  examples:
    - 他们俩正是这样有思想的一对青年。在当时新思想的影响下，他们走上了革命之路。不少人热情地歌颂了他们的反抗和爱情，但是鲁迅先生以敏锐的目光看到了这种反抗和爱情中所包含的悲剧因素。（转折句群）
    - 单位楼下的路口，新开了两家卖早餐的店，早餐的主要顾客，是在附近写字楼上班的人。虽然卖着同样的早餐，味道差不多，价格也一样，而且每天早上每家店前都排满了顾客，但月底一计算，东边胖大姐的利润却是西边瘦大姐的两倍多。仔细观察一番才发现，原来差别竟出在经营策略上一瘦大姐坚持自己十几年卖早餐的传统方式，每收一个顾客的钱，就卷一个饼，然后收下一个顾客的钱，再卷一个饼。而胖大姐则截然不同，她事先把做好的饼摆整齐，自己只管收钱和找钱，前面并排放着五双筷子，让交完钱的顾客自己动手卷菜。（因果句群）
