# Hokkien loanwords Indonesians know, with their Mandarin forms (CLAUDE.md §6.7, PRD §1). Only the
# Kata card uses them. Draft: each entry needs `reviewed_by` from someone who knows the Hokkien form
# before it shows outside draft builds.
- id_word: "bakmi"
  hokkien: "bah-mī (肉麵)"
  zh: "肉 面"
  py: "ròu miàn"
  meaning: { id: "mi dengan daging; dalam Mandarin 面 sendiri sudah berarti mi", en: "noodles with meat; in Mandarin 面 alone already means noodles" }
- id_word: "bakpao"
  hokkien: "bah-pau (肉包)"
  zh: "肉包"
  py: "ròubāo"
  meaning: { id: "bakpao isi daging; 包子 bāozi untuk bakpao pada umumnya", en: "meat bun; 包子 bāozi for buns in general" }
- id_word: "angpao"
  hokkien: "âng-pau (紅包)"
  zh: "红包"
  py: "hóngbāo"
  meaning: { id: "amplop merah berisi uang", en: "red envelope with money" }
