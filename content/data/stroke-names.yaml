# Stroke names for characters the lessons teach stroke by stroke (DESIGN §8.5). The stroke data has no
# stroke types, so the app names strokes heuristically (lib/zh/trace.ts classifyStroke); these authored
# sequences win for the characters listed. Names: heng 横, shu 竖, pie 撇, dian 点, na 捺, ti 提, zhe 折, gou 钩.
